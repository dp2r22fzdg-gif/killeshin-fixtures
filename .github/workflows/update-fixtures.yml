name: Update fixtures

on:
  schedule:
    # Every hour, ten past. GitHub often runs these late, so treat it as
    # "roughly hourly" rather than on the dot.
    - cron: '10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4

      - name: Update everything
        run: python update.py

      - name: Commit if anything changed
        run: |
          git config user.name  "Killeshin GAA bot"
          git config user.email "actions@github.com"
          git add index.html killeshin-all.ics killeshin-men.ics killeshin-ladies.ics killeshin-home.ics
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
