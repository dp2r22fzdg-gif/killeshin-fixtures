name: Update fixtures

on:
  schedule:
    - cron: '10 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Gather local news
        run: python news.py
        continue-on-error: true
      - name: Scrape Laois GAA
        run: python scrape.py
      - name: Commit if anything changed
        run: |
          git config user.name  "Killeshin GAA bot"
          git config user.email "actions@github.com"
          git add killeshin.json news.json
          if git diff --staged --quiet; then
            echo "No change today."
          else
            git commit -m "Fixtures update $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
