<style>
/* Palette taken straight off the crest: black line art, its green banner,
   white stone. Nothing else earns a place. */
:root{
  --ink:#000;
  --green:#17A94C;      /* the banner green, pushed to full strength */
  --green-deep:#0A5C2A;
  --green-pale:#E8F6ED;
  --red:#D6222E;
  --white:#fff;
  --grey:#F1F1EE;
  --mute:#63676A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--white);color:var(--ink);
  font-family:Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;
  padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{margin:0;line-height:1}
.d{font-family:'Archivo Black',Archivo,Arial,sans-serif;font-weight:400;letter-spacing:-.015em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* ── masthead ─────────────────────────────────────────── */
.mast{background:var(--ink);color:var(--white);
  padding:calc(16px + env(safe-area-inset-top)) 16px 16px;
  display:flex;align-items:center;gap:14px;border-bottom:5px solid var(--green)}
.mast .badge{width:64px;height:64px;flex:none;background:var(--white);
  display:grid;place-items:center;padding:6px}
.mast .badge img{width:100%;height:100%;object-fit:contain}
.mast h1{font-size:27px;text-transform:uppercase}
.mast p{margin:5px 0 0;font-size:11.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--green)}

/* ── next match: a scoreboard slab ────────────────────── */
.next{background:var(--ink);color:var(--white);padding:16px;position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:-44px;top:50%;transform:translateY(-50%);
  width:210px;height:210px;background:url(crest.png) no-repeat center/contain;
  filter:brightness(0) invert(1);opacity:.08;pointer-events:none}
.next>*{position:relative;z-index:1}
.next .when{display:inline-block;background:var(--green);color:var(--ink);
  font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 9px;margin-bottom:14px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.board .side{font-size:26px;text-transform:uppercase;line-height:.98}
.board .side.us{color:var(--green)}
.board .side.away{text-align:right}
.board .v{font-size:13px;color:var(--white);opacity:.45;letter-spacing:.1em}
.next .meta{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);
  font-size:13.5px;color:#B9BDBE;line-height:1.55}
.next .meta strong{color:var(--white);font-weight:600}

/* ── next at home ─────────────────────────────────────── */
.home{display:flex;gap:13px;align-items:center;padding:14px 16px;
  background:var(--green-pale);border-bottom:3px solid var(--ink)}
.home img{width:44px;height:44px;object-fit:contain;flex:none}
.home .lab{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--green-deep)}
.home .ln{font-size:17px;margin-top:4px;text-transform:uppercase}
.home .sub{font-size:13px;color:var(--mute);margin-top:3px;font-weight:500}

/* ── filters + tabs ───────────────────────────────────── */
.grades{display:flex;gap:6px;overflow-x:auto;padding:11px 16px;background:var(--white);
  border-bottom:1px solid #DDDCD7;scrollbar-width:none;position:sticky;top:0;z-index:20}
.grades::-webkit-scrollbar{display:none}
.grades[hidden]{display:none}
.chip{flex:none;padding:0 13px;height:34px;line-height:32px;border:2px solid var(--ink);
  background:var(--white);font-size:13.5px;font-weight:600;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.03em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.tabs{display:flex;background:var(--white);border-bottom:3px solid var(--ink);
  position:sticky;top:57px;z-index:19}
.tabs.solo{top:0}
.tab{flex:1;height:46px;font-size:13px;font-weight:700;color:var(--mute);
  text-transform:uppercase;letter-spacing:.09em;border-bottom:4px solid transparent;
  margin-bottom:-3px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}

/* ── lists ────────────────────────────────────────────── */
main{padding:0 0 34px}
.dayhead{background:var(--ink);color:var(--white);font-size:12.5px;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;padding:7px 16px;
  position:sticky;top:103px;z-index:18}
.solo~main .dayhead{top:46px}
.dayhead.soon{background:var(--green);color:var(--ink)}
.match{display:block;padding:14px 16px;border-bottom:1px solid #E4E3DE;background:var(--white)}
.match.athome{border-left:6px solid var(--green);padding-left:10px}
.match .top{display:flex;align-items:baseline;gap:11px}
.match .time{font-size:17px;min-width:54px;flex:none}
.match .teams{font-size:16px;font-weight:500;line-height:1.28;flex:1}
.match .teams b{font-weight:700}
.match .comp,.match .venue{font-size:12.5px;color:var(--mute);margin-left:65px;line-height:1.4}
.match .comp{margin-top:5px}
.match .venue.h{color:var(--green-deep);font-weight:700}

/* results */
.res{display:flex;gap:12px;align-items:stretch}
.mark{width:28px;flex:none;color:var(--white);font-size:14px;display:grid;place-items:center;
  font-family:'Archivo Black',Arial,sans-serif}
.mark.W{background:var(--green)}.mark.L{background:var(--red)}.mark.D{background:var(--mute)}
.res .body{flex:1;min-width:0}
.line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:1.5px 0}
.line .nm{font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line.win .nm{font-weight:700}
.line .sc{font-size:18px;flex:none;font-variant-numeric:tabular-nums}
.line .sc small{font-size:11.5px;color:var(--mute);margin-left:6px;font-family:Archivo,Arial,sans-serif;
  font-weight:600}
.res .sub{font-size:12.5px;color:var(--mute);margin-top:6px;line-height:1.4}

/* tables */
.tbl{border-bottom:3px solid var(--ink);background:var(--white)}
.tbl h3{font-size:16px;padding:13px 16px 4px;text-transform:uppercase}
.tbl .grd{font-size:11px;color:var(--green-deep);padding:0 16px 10px;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:10.5px;font-weight:700;color:var(--white);background:var(--ink);text-align:right;
  padding:6px 4px;letter-spacing:.06em;text-transform:uppercase}
th.t,td.t{text-align:left;padding-left:16px;width:100%}
th.p,td.p{padding-right:16px;font-weight:700}
td{padding:9px 4px;text-align:right;border-bottom:1px solid #EDECE7}
tr:last-child td{border-bottom:0}
tr.us{background:var(--green-pale);box-shadow:inset 4px 0 0 var(--green)}
tr.us td{font-weight:700}

/* ── news ─────────────────────────────────────────────── */
.newshead{padding:18px 16px 10px}
.newshead h2{font-size:20px;text-transform:uppercase}
.newshead h2 .rule{display:block;width:44px;height:5px;background:var(--green);margin-bottom:9px}
.newshead p{margin:6px 0 0;font-size:13px;color:var(--mute);line-height:1.45}
.story{display:block;padding:14px 16px;border-bottom:1px solid #E4E3DE;background:var(--white)}
.story h3{font-size:16.5px;font-weight:600;line-height:1.3;font-family:Archivo,Arial,sans-serif}
.story .by{margin-top:7px;font-size:12px;color:var(--mute);font-weight:500}
.story .by b{color:var(--green-deep);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pin{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;background:var(--grey);color:#4E5254;margin-left:7px}
/* subscriber stories get their own black-ruled block */
.paid{background:var(--grey);border-top:4px solid var(--ink)}
.paid .newshead h2 .rule{background:var(--ink)}
.paid .story{background:transparent;border-bottom-color:#DEDDD8}
.paid .pin.lock{background:var(--ink);color:var(--white)}

/* ── footer / empty ───────────────────────────────────── */
.foot{background:var(--ink);color:#9DA1A3;padding:22px 16px calc(28px + env(safe-area-inset-bottom));
  font-size:12.5px;line-height:1.65;display:flex;gap:14px;align-items:flex-start}
.foot img{width:44px;height:44px;object-fit:contain;flex:none;filter:brightness(0) invert(1);opacity:.75}
.foot a,.foot b{color:var(--green)}
.foot b{font-weight:700}
.empty{padding:44px 24px 52px;text-align:center;color:var(--mute)}
.empty img{width:62px;height:62px;object-fit:contain;opacity:.22;margin:0 auto 14px;display:block}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.04em}
@media (min-width:620px){
  body{max-width:620px;margin:0 auto;border-left:1px solid #E4E3DE;border-right:1px solid #E4E3DE}
  .mast h1{font-size:31px}
}
</style>
</head>

trikes late as O'Dempsey's reach final | Killeshin send Ballyfin packing","source":"LaoisToday","tag":"GAA","access":"subscriber","url":"https://www.laoistoday.ie/2026/06/27/acfl-division-2-finlay-strikes-late-as-odempseys-reach-final-killeshin-send-ballyfin-packing/"},{"date":"2025-09-04","title":"Killeshin GAA score €15,000 after Electric Picnic can and bottle collection","source":"LaoisToday","tag":"Club","access":"subscriber","url":"https://www.laoistoday.ie/2025/09/04/killeshin-gaa-score-e15000-after-electric-picnic-can-and-bottle-collection/"}]}</script>
<script>
(function(){
"use strict";

var DATA = JSON.parse(document.getElementById('seed').textContent);
var grade = 'All', view = 'fixtures';
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function d(s){ var p=s.split('-'); return new Date(+p[0], p[1]-1, +p[2]); }
function longDate(s){ var x=d(s); return DAY[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]; }
function shortDate(s){ var x=d(s); return DAY[x.getDay()].slice(0,3)+' '+x.getDate()+' '+MON[x.getMonth()]; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function daysAway(s){ var t=new Date(); t.setHours(0,0,0,0); return Math.round((d(s)-t)/86400000); }
function label(n){ return n===DATA.teamName ? 'Killeshin' : n; }
function atHome(m){ return (m.venue||'').indexOf('Killeshin') > -1; }
function upcoming(){ return DATA.fixtures.filter(function(f){ return daysAway(f.date) >= 0; }); }
function byGrade(l){ return grade==='All' ? l : l.filter(function(m){ return m.grade===grade; }); }
function crest(){ return '<img src="crest.png" alt="">'; }

/* ---- next match, and next one at home ---- */
function renderNext(){
  var up = upcoming(), box = document.getElementById('next');
  if(!up.length){ box.hidden = true; } else {
    var f = up[0], n = daysAway(f.date);
    box.hidden = false;
    document.getElementById('nextWhen').textContent =
      (n===0?'Today':n===1?'Tomorrow':'In '+n+' days') + ' \u00b7 ' + shortDate(f.date) + ' \u00b7 ' + f.time;
    document.getElementById('nextHome').className = 'side d' + (f.isHome?' us':'');
    document.getElementById('nextAway').className = 'side away d' + (f.isHome?'':' us');
    document.getElementById('nextHome').textContent = label(f.home);
    document.getElementById('nextAway').textContent = label(f.away);
    document.getElementById('nextMeta').innerHTML = esc(f.competition) +
      '<br><strong>' + esc(f.venue) + '</strong>' +
      (f.referee && f.referee!=='TBC' ? ' \u00b7 Ref ' + esc(f.referee) : '');
  }

  var hm = upcoming().filter(atHome)[0], hbox = document.getElementById('homeNext');
  /* Skip it when the very next match is already the home one. */
  if(!hm || (up.length && hm === up[0])){ hbox.hidden = true; return; }
  hbox.hidden = false;
  document.getElementById('homeLine').textContent = hm.grade + ' v ' + label(hm.opponent);
  document.getElementById('homeSub').textContent =
    shortDate(hm.date) + ' \u00b7 ' + hm.time + ' \u00b7 ' + (DATA.ground || hm.venue);
}

/* ---- fixtures ---- */
function renderFixtures(){
  var list = byGrade(upcoming());
  if(!list.length) return empty('No fixtures listed',
    grade==='All' ? 'Nothing down for any team yet. New fixtures appear the morning after the county board publishes them.'
                  : 'Nothing down for ' + grade + ' right now. Try another team above.');
  var html='', day=null;
  list.forEach(function(f){
    if(f.date!==day){
      day=f.date; var n=daysAway(f.date);
      html += '<div class="dayhead'+(n<=2?' soon':'')+'">' + esc(longDate(f.date)) +
              (n===0?' \u2014 today':n===1?' \u2014 tomorrow':'') + '</div>';
    }
    html += '<div class="match'+(atHome(f)?' athome':'')+'"><div class="top">' +
      '<div class="time d">'+esc(f.time)+'</div><div class="teams">'+teamLine(f.home,f.away)+'</div></div>' +
      '<div class="comp">'+esc(f.competition)+'</div>' +
      '<div class="venue'+(atHome(f)?' h':'')+'">'+esc(f.venue)+(atHome(f)?' \u00b7 home':'')+'</div></div>';
  });
  return html;
}
function teamLine(h,a){
  var H=h===DATA.teamName, A=a===DATA.teamName;
  return (H?'<b>':'')+esc(label(h))+(H?'</b>':'')+' v '+(A?'<b>':'')+esc(label(a))+(A?'</b>':'');
}

/* ---- results ---- */
function renderResults(){
  var list = byGrade(DATA.results);
  if(!list.length) return empty('No results yet',
    'Once ' + (grade==='All'?'a Killeshin team':grade) + ' plays, the score shows up here.');
  var html='', day=null;
  list.forEach(function(r){
    if(r.date!==day){ day=r.date; html += '<div class="dayhead">'+esc(longDate(r.date))+'</div>'; }
    html += '<div class="match"><div class="res">' +
      '<div class="mark '+r.outcome+'">'+r.outcome+'</div><div class="body">' +
      scoreLine(r.home,r.homeScore,r.homeTotal,r.homeTotal>r.awayTotal) +
      scoreLine(r.away,r.awayScore,r.awayTotal,r.awayTotal>r.homeTotal) +
      '<div class="sub">'+esc(r.competition)+'<br>'+esc(r.venue)+'</div></div></div></div>';
  });
  return html;
}
function scoreLine(n,sc,tot,won){
  return '<div class="line'+(won?' win':'')+'"><div class="nm">'+esc(label(n))+'</div>' +
         '<div class="sc d">'+esc(sc)+'<small>'+tot+'</small></div></div>';
}

/* ---- tables ---- */
function renderTables(){
  var list = grade==='All' ? DATA.tables : DATA.tables.filter(function(t){ return t.grade===grade; });
  if(!list.length) return empty('No table for this team',
    'Knockout and championship groups do not always run a league table.');
  return list.map(function(t){
    var rows = t.rows.map(function(r,i){
      return '<tr'+(r.team===DATA.teamName?' class="us"':'')+'><td>'+(i+1)+'</td>' +
        '<td class="t">'+esc(label(r.team))+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td>' +
        '<td>'+r.l+'</td><td>'+r.f+'</td><td>'+r.a+'</td><td class="p">'+r.pts+'</td></tr>';
    }).join('');
    return '<section class="tbl"><h3 class="d">'+esc(t.competition)+'</h3>' +
      '<div class="grd">'+esc(t.grade)+'</div>' +
      '<table><thead><tr><th></th><th class="t">Team</th><th>P</th><th>W</th><th>D</th><th>L</th>' +
      '<th>For</th><th>Ag</th><th class="p">Pts</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
  }).join('');
}

/* ---- news: free to read first, subscriber stories grouped below ---- */
function renderNews(){
  var all = DATA.news || [];
  if(!all.length) return empty('Nothing in the papers yet',
    'Anything the local papers publish about Killeshin lands here within a day.');
  var free = all.filter(function(n){ return n.access !== 'subscriber'; });
  var paid = all.filter(function(n){ return n.access === 'subscriber'; });
  var html = '';

  if(free.length){
    html += head('Free to read', 'Open these and read the whole story, no account needed.') +
      free.map(story).join('');
  } else {
    html += empty('Nothing free this week', 'The subscriber stories below are all that came up.');
  }
  if(paid.length){
    html += '<div class="paid">' +
      head('Behind a subscription', 'You will hit a paywall on these. Headline and link only.') +
      paid.map(story).join('') + '</div>';
  }
  return html;
}
function head(t,p){
  return '<div class="newshead"><h2 class="d"><span class="rule"></span>'+esc(t)+'</h2>' +
         '<p>'+esc(p)+'</p></div>';
}
function story(n){
  var age = -daysAway(n.date), when = shortDate(n.date);
  if(age === 0) when = 'Today';
  else if(age === 1) when = 'Yesterday';
  else if(age > 1 && age < 7) when = age + ' days ago';
  return '<a class="story" href="'+esc(n.url)+'" target="_blank" rel="noopener">' +
    '<h3>'+esc(n.title)+'</h3><div class="by"><b>'+esc(n.source)+'</b> \u00b7 '+esc(when) +
    (n.tag ? '<span class="pin">'+esc(n.tag)+'</span>' : '') +
    (n.access==='subscriber' ? '<span class="pin lock">Subscribers</span>' : '') +
    '</div></a>';
}

function empty(title,msg){
  return '<div class="empty">'+crest()+'<b>'+esc(title)+'</b>'+esc(msg)+'</div>';
}

/* ---- shell ---- */
function chips(){
  var all = ['All'].concat(DATA.grades || []);
  document.getElementById('grades').innerHTML = all.map(function(g){
    return '<button class="chip" aria-pressed="'+(g===grade)+'" data-g="'+esc(g)+'">'+esc(g)+'</button>';
  }).join('');
}
function draw(){
  /* The team filter means nothing on the news tab, so it steps out of the way. */
  var news = view === 'news';
  document.getElementById('grades').hidden = news;
  document.getElementById('tabs').className = 'tabs' + (news ? ' solo' : '');
  document.getElementById('out').innerHTML =
    view==='fixtures' ? renderFixtures() :
    view==='results'  ? renderResults()  :
    view==='tables'   ? renderTables()   : renderNews();
  window.scrollTo(0,0);
}
document.getElementById('grades').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if(!b) return;
  grade = b.dataset.g; chips(); draw();
});
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    view = t.dataset.view;
    document.querySelectorAll('.tab').forEach(function(x){
      x.setAttribute('aria-selected', String(x===t)); });
    draw();
  });
});
function stamp(){
  var u = new Date(DATA.updated);
  var same = u.toDateString() === new Date().toDateString();
  document.getElementById('stamp').textContent = 'Updated ' +
    (same ? 'today at ' + u.toTimeString().slice(0,5) : shortDate(DATA.updated.slice(0,10)));
  document.getElementById('src').href = DATA.source;
}
function boot(){ chips(); renderNext(); draw(); stamp(); }
boot();

fetch('killeshin.json?t=' + Date.now(), {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(j){ if(j && j.fixtures && j.results){ DATA = j; boot(); } })
  .catch(function(){ /* keep the built-in copy */ });

})();
</script>
</body>
</html>
