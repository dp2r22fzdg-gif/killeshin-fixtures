<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Killeshin GAA — Fixtures, Results &amp; News</title>
<meta name="description" content="Every Killeshin fixture, result, league table and news story — men's and ladies, senior down to U12. Updated hourly.">
<meta name="theme-color" content="#1A7A48">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Killeshin GAA">
<link rel="apple-touch-icon" href="crest.png">
<link rel="icon" href="crest.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#1A7A48; --green:#23A65A; --green-dk:#12663A;
  --green-lt:#E9F7EF; --ink:#14201A; --grey:#54605A; --grey-lt:#6D7A73;
  --line:#E6EBE7; --line-dk:#C7D1CB; --paper:#fff; --paper-2:#F6F9F7;
  --r:20px;            /* the softening: one generous radius, used everywhere */
  --r-sm:12px;
  --crest:url(crest.png);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper-2);color:var(--ink);
  font-family:Archivo,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:10px}
.dsp{font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif;font-weight:800;
  letter-spacing:-.03em;line-height:1.02}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ── masthead: the crest given room ─────────────────────── */
.mast{background:var(--forest);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 20px;
  display:flex;align-items:center;gap:16px;border-radius:0 0 26px 26px}
.mast .badge{width:66px;height:66px;flex:none;background:#fff;border-radius:50%;
  display:grid;place-items:center;padding:7px}
.mast .badge img{width:100%;height:100%;object-fit:contain}
.mast h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.mast span{display:block;font-size:12px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:#DDF2E6;margin-top:4px}

/* ── branch switch: three big, obvious buttons ──────────── */
.branch{display:flex;gap:9px;padding:16px 16px 4px;margin-top:-14px}
.br{flex:1;background:var(--paper);border-radius:var(--r);padding:13px 6px 11px;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  font-size:13.5px;font-weight:700;color:var(--grey);
  border:2px solid var(--line);box-shadow:0 2px 10px rgba(20,60,40,.05)}
.br img{width:38px;height:38px;object-fit:contain;opacity:.42}
.br .dual{display:flex;width:38px;height:38px;align-items:center;justify-content:center}
.br .dual img{width:26px;height:26px;margin:0 -5px}
.br[aria-pressed="true"]{background:var(--forest);border-color:var(--green-dk);color:#fff;
  box-shadow:0 4px 14px rgba(26,122,72,.28)}
.br[aria-pressed="true"] img{opacity:1;filter:brightness(0) invert(1)}

/* ── next match ─────────────────────────────────────────── */
.wrap{padding:12px 16px 0}
.hero{background:var(--forest);color:#fff;border-radius:var(--r);padding:20px;
  position:relative;overflow:hidden;box-shadow:0 4px 18px rgba(26,122,72,.22)}
.hero::after{content:"";position:absolute;right:-58px;top:-40px;width:250px;height:250px;
  background:var(--crest) no-repeat center/contain;filter:brightness(0) invert(1);
  opacity:.09;pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .cap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .cap .lbl{color:#DDF2E6}
.hero .cap .cd{background:#fff;color:var(--green-dk);font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
/* the score-line: who, then who, big */
.vs{margin:18px 0 0}
.vs .side{display:flex;align-items:center;gap:12px;padding:5px 0}
.vs .side img{width:34px;height:34px;object-fit:contain;flex:none;
  filter:brightness(0) invert(1);opacity:.95}
.vs .side .dot{width:34px;height:34px;flex:none;border-radius:50%;
  background:rgba(255,255,255,.14);display:grid;place-items:center;
  font-size:13px;font-weight:700;color:#DDF2E6}
.vs .side b{font-size:26px;font-family:'Bricolage Grotesque',Archivo,sans-serif;
  font-weight:800;letter-spacing:-.03em;line-height:1.05}
.vs .side.them b{font-weight:600;color:#DDF2E6}
.hero .facts{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.22);
  display:flex;flex-direction:column;gap:9px}
.fact{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.45}
.fact .k{width:20px;flex:none;text-align:center;opacity:.75;font-size:13px}
.fact b{font-weight:700}
.fact a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.hero .wx{margin-top:14px;background:rgba(255,255,255,.13);border-radius:var(--r-sm);
  padding:11px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.hero .wx b{font-weight:700}

/* ── next at home ───────────────────────────────────────── */
.athome{margin:10px 16px 0;background:var(--green-lt);border-radius:var(--r);
  padding:15px 16px;display:flex;gap:14px;align-items:center}
.athome img{width:42px;height:42px;object-fit:contain;flex:none}
.athome .lbl{color:var(--green-dk)}
.athome .l{font-size:16.5px;font-weight:700;margin-top:4px}
.athome .s{font-size:13.5px;color:var(--green-dk);font-weight:500;margin-top:1px}

/* ── nav ────────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:30;background:var(--paper-2);padding-top:14px}
.tabs{display:flex;gap:5px;margin:0 16px;background:var(--paper);border-radius:999px;
  padding:5px;box-shadow:0 2px 10px rgba(20,60,40,.06);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;white-space:nowrap;padding:9px 13px;border-radius:999px;font-size:12.5px;
  font-weight:700;color:var(--grey);letter-spacing:.02em;border:1.5px solid var(--line)}
.tab[aria-selected="true"]{background:var(--forest);color:#fff;border-color:var(--green-dk)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;
  align-items:center}
.filters::-webkit-scrollbar{display:none}
.filters[hidden]{display:none}
.chip{flex:none;font-size:13.5px;font-weight:600;color:var(--grey);white-space:nowrap;
  padding:7px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.home-t{flex:none;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;
  color:var(--grey);white-space:nowrap;padding:7px 14px 7px 12px;background:var(--paper);
  border:1px solid var(--line);border-radius:999px}
.home-t::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-dk)}
.home-t[aria-pressed="true"]{color:#fff;background:var(--green-dk);border-color:var(--green-dk)}
.home-t[aria-pressed="true"]::before{background:#fff}

/* ── lists: soft cards, no hard rules ───────────────────── */
main{padding:8px 16px 20px}
.dayhead{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grey);padding:18px 4px 9px}
.dayhead.soon{color:var(--green-dk)}
.card{background:var(--paper);border-radius:var(--r);padding:15px 16px;margin-bottom:9px;
  box-shadow:0 2px 10px rgba(20,60,40,.05);position:relative;overflow:hidden}
.card.hm::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.card.hm{padding-left:19px}
.row{display:flex;gap:15px}
.row .time{font-size:16px;font-weight:700;min-width:46px;flex:none;padding-top:1px}
.row .mid{flex:1;min-width:0}
.row .mid .tt{font-size:16.5px;font-weight:500;line-height:1.4}
.row .mid .tt b{font-weight:700}
.row .mid .sub{font-size:13.5px;color:var(--grey);margin-top:5px;line-height:1.5}
.dir{display:inline-flex;align-items:center;gap:5px;color:var(--green-dk);font-weight:600;
  background:var(--green-lt);padding:4px 11px;border-radius:999px;margin-top:8px;font-size:13px}
.bm{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;
  border-radius:999px;margin-right:8px;vertical-align:1px}
.bm.men{background:var(--forest);color:#fff}
.bm.ladies{background:var(--green);color:#fff}

.card.win::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.card.loss::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line-dk)}
.card.draw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grey-lt)}
.card.win,.card.loss,.card.draw{padding-left:19px}
.sl{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:2px 0}
.sl .n{font-size:16px;font-weight:500;color:var(--grey);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.sl.w .n{color:var(--ink);font-weight:700}
.sl .s{font-size:20px;flex:none;color:var(--grey)}
.sl.w .s{color:var(--ink)}
.sl .s em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--grey-lt);
  margin-left:7px;font-family:Archivo,Arial,sans-serif;letter-spacing:0}

/* ── form guide ─────────────────────────────────────────── */
.form{display:flex;align-items:center;gap:7px;margin-top:4px}
.form .lbl{color:var(--grey-lt);font-size:10.5px}
.form i{width:23px;height:23px;border-radius:50%;font-style:normal;font-size:11.5px;
  font-weight:700;display:grid;place-items:center;color:#fff}
.form i.W{background:var(--green)}
.form i.L{background:var(--line-dk);color:var(--grey)}
.form i.D{background:var(--grey-lt)}

/* ── tables ─────────────────────────────────────────────── */
.tbl{background:var(--paper);border-radius:var(--r);margin-bottom:10px;overflow:hidden;
  box-shadow:0 2px 10px rgba(20,60,40,.05)}
.tbl .hd{padding:17px 18px 13px}
.tbl .hd h3{font-size:17px;line-height:1.3}
.tbl .hd .lbl{color:var(--green-dk);margin-bottom:7px;display:block}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--grey-lt);text-align:right;padding:0 3px 9px;background:var(--paper-2)}
th{padding-top:9px}
th.t,td.t{text-align:left;width:100%;padding-left:18px}
td.t{font-weight:500}
th.p,td.p{padding-right:18px}
td{padding:13px 3px;text-align:right;border-top:1px solid var(--line);color:var(--grey)}
td.t,td.p{color:var(--ink)}
td.p{font-weight:700}
tr.us td{background:var(--green-lt);color:var(--ink);font-weight:700}

/* ── news ───────────────────────────────────────────────── */
.sec{padding:20px 4px 10px}
.sec h2{font-size:20px}
.sec .lbl{color:var(--green-dk);display:block;margin-bottom:8px}
.sec p{margin:8px 0 0;font-size:14px;color:var(--grey);line-height:1.55}
.story{display:block;background:var(--paper);border-radius:var(--r);padding:16px 18px;
  margin-bottom:9px;box-shadow:0 2px 10px rgba(20,60,40,.05)}
.story h3{font-size:17px;font-weight:600;line-height:1.45}
.story.lead h3{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.025em;
  font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif}
.story .by{margin-top:10px;font-size:12.5px;color:var(--grey);font-weight:600}
.story .by b{color:var(--green-dk);font-weight:700}
.story .by s{text-decoration:none;color:var(--grey-lt)}
.paid .story{background:#EFF3F0;box-shadow:none}

/* ── alerts + club ──────────────────────────────────────── */
.panel{background:var(--paper);border-radius:var(--r);padding:20px;margin-bottom:10px;
  box-shadow:0 2px 10px rgba(20,60,40,.05)}
.panel .lbl{color:var(--green-dk);display:block;margin-bottom:9px}
.panel h2{font-size:20px;margin-bottom:9px}
.panel p{margin:0 0 16px;font-size:14.5px;color:var(--grey);line-height:1.6}
.panel p b{color:var(--ink);font-weight:600}
.btn{display:block;background:var(--forest);color:#fff;text-align:center;padding:16px;
  font-size:15px;font-weight:700;border-radius:999px;margin-bottom:9px}
.btn.alt{background:var(--green-lt);color:var(--green-dk)}
.fine{font-size:13px;color:var(--grey-lt);line-height:1.6;margin:14px 0 0}
.act{display:flex;align-items:center;gap:15px;background:var(--paper);border-radius:var(--r);
  padding:16px 18px;margin-bottom:9px;box-shadow:0 2px 10px rgba(20,60,40,.05)}
.act .ic{width:44px;height:44px;flex:none;border-radius:50%;background:var(--green-lt);
  display:grid;place-items:center;font-size:17px;font-weight:800;color:var(--green-dk);
  font-family:'Bricolage Grotesque',Archivo,sans-serif}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-size:16.5px;font-weight:700}
.act .tx span{display:block;font-size:13.5px;color:var(--grey);margin-top:2px;line-height:1.4}
.act .go{flex:none;font-size:19px;color:var(--green)}

/* ── footer ─────────────────────────────────────────────── */
.foot{background:var(--forest);color:#DDF2E6;margin:10px 0 0;
  padding:26px 20px calc(30px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;font-size:13px;line-height:1.75;
  display:flex;gap:16px;align-items:flex-start}
.foot img{width:46px;height:46px;object-fit:contain;flex:none;
  filter:brightness(0) invert(1);opacity:.7}
.foot a,.foot b{color:#fff;font-weight:600}
.count{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.15);
  border-radius:999px;padding:4px 12px;margin-top:9px;font-size:12.5px;font-weight:600;color:#fff}
.count[hidden]{display:none}
.empty{padding:46px 26px 54px;text-align:center;color:var(--grey)}
.empty img{width:58px;height:58px;object-fit:contain;opacity:.2;margin:0 auto 16px;display:block}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:7px;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800}
.empty span{font-size:14.5px;line-height:1.55;display:block;max-width:290px;margin:0 auto}
@media (min-width:620px){
  body{max-width:600px;margin:0 auto}
  .vs .side b{font-size:31px}
}
</style>
</head>

<header class="mast">
  <span class="badge"><img id="mastCrest" src="crest.png" alt="Killeshin GAA crest"></span>

</header>

    <span class="dual"><img src="crest.png" alt=""><img src="crest-ladies.png" alt=""></span>Both</button>

  <button class="br" data-b="ladies" aria-pressed="false">

<div class="wrap">

</div>

</section>

<div class="nav">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-view="fixtures">Fixtures</button>

    <button class="tab" role="tab" aria-selected="false" data-view="news">News</button>
    <button class="tab" role="tab" aria-selected="false" data-view="alerts">Alerts</button>

<main id="out"></main>

  <div>
    <span id="stamp"></span>
    <br><span class="count" id="count" hidden></span>
    <br><span style="opacity:.55;font-size:11.5px">Build 2026-09-05 12:24</span>
  </div>

","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2025/04/07/acfl-division-3-killeshin-see-off-neighbours-crettyard-for-second-win/"},{"date":"2025-03-07","title":"Kelly Cup: Champions again as St Joseph’s defeat Killeshin for third title in four years","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2025/03/07/kelly-cup-champions-again-as-st-josephs-defeat-killeshin-for-third-title-in-four-years/"},{"date":"2025-03-03","title":"Kelly Cup: Killeshin edge past Rosenallis to set up a repeat final with St Joseph’s","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2025/03/03/kelly-cup-killeshin-edge-past-rosenallis-to-set-up-a-repeat-final-with-st-josephs/"},{"date":"2025-02-22","title":"Kelly Cup: Killeshin remain unbeaten to book semi-final place","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2025/02/22/kelly-cup-killeshin-remain-unbeaten-to-book-semi-final-place/"},{"date":"2025-02-12","title":"Sadness in Killeshin following the passing of former juvenile GAA chairman and coach","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2025/02/12/sadness-in-killeshin-following-the-passing-of-former-juvenile-gaa-chairman-and-coach/"},{"date":"2025-02-07","title":"Kelly Cup: Lowry to the fore as Killeshin off to winning start under the bright new lights of Ratheniska","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2025/02/07/kelly-cup-lowry-to-the-fore-as-killeshin-off-to-winning-start-under-the-bright-new-lights-of-ratheniska/"},{"date":"2024-11-28","title":"Killenard are class as they see off Killeshin for Division 1 Shield glory","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2024/11/28/killenard-are-class-as-they-see-off-killeshin-for-division-1-shield-glory/"},{"date":"2024-11-28","title":"Mountmellick produce phenomenal comeback to beat Killeshin in epic Division 1 Shield final","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2024/11/28/mountmellick-produce-phenomenal-comeback-to-beat-killeshin-in-epic-division-1-shield-final/"},{"date":"2024-11-15","title":"Laois U-20 FC ‘B’ Final: Fitzgerald goal means glory for Killeshin in physical battle with Portarlington","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2024/11/15/laois-u-20-fc-b-final-fitzgerald-goal-means-glory-for-killeshin-in-physical-battle-with-portarlington/"},{"date":"2024-11-15","title":"Laois U-20 FC ‘B’ Final: Silverware on the line as Portarlington and Killeshin prepare for battle","source":"LaoisToday","tag":"GAA","access":"free","url":"https://www.laoistoday.ie/2024/11/15/laois-u-20-fc-b-final-silverware-on-the-line-as-portarlington-and-killeshin-prepare-for-battle/"}]}</script>
<script>
(function(){
"use strict";

var DATA;
try { DATA = JSON.parse(document.getElementById('seed').textContent); }
catch(err){
  console.error('built-in data unreadable', err);
  DATA = {fixtures:[],results:[],tables:[],news:[],branches:{},gradesBy:{},ground:''};
}

/* Both is the landing view - most people want the whole parish, not one branch. */
var branch = 'all', grade = 'All', homeOnly = false, view = 'fixtures';
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function d(s){ var p=s.split('-'); return new Date(+p[0], p[1]-1, +p[2]); }
function longDate(s){ var x=d(s); return DAY[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]; }
function shortDate(s){ var x=d(s); return DAY[x.getDay()].slice(0,3)+' '+x.getDate()+' '+MON[x.getMonth()]; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function daysAway(s){ var t=new Date(); t.setHours(0,0,0,0); return Math.round((d(s)-t)/86400000); }
function br(b){ var B = DATA.branches || {}; return B[b] || B.men ||
  {name:"Men's", team:'Gleann Uiseann', crest:'crest.png', source:'#'}; }
function ourName(b){ return br(b).team; }
function label(n,b){ return n===ourName(b) ? 'Killeshin' : n; }
function atHome(m){ return (m.venue||'').indexOf('Killeshin') > -1; }
function upcoming(){ return DATA.fixtures.filter(function(f){ return daysAway(f.date) >= 0; }); }
function mixed(){ return branch === 'all'; }
function crestOf(b){ return br(b).crest; }

/* Directions: a maps search by venue name is more reliable than storing
   coordinates for thirty grounds, and opens the phone's own maps app. */
function mapUrl(venue){
  if(!venue || venue === 'TBC') return null;
  var q = venue.indexOf('Ireland') > -1 ? venue : venue + ', Ireland';
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
}
/* Only on away games - nobody needs directions to their own pitch. */
function directions(match){
  if(atHome(match)) return '';
  var u = mapUrl(match.venue);
  if(!u) return '';
  return '<a class="dir" href="'+u+'" target="_blank" rel="noopener">\u2192 Directions</a>';
}

function pick(list){
  return list.filter(function(m){
    if(branch !== 'all' && m.branch !== branch) return false;
    if(grade !== 'All' && m.grade !== grade) return false;
    if(homeOnly && !atHome(m)) return false;
    return true;
  });
}
function mark(m){
  return mixed() ? '<span class="bm '+m.branch+'">'+(m.branch==='men'?"MEN'S":'LADIES')+'</span>' : '';
}

/* ---- form guide: last five for a branch and grade ---- */
function formFor(b, g){
  var list = DATA.results.filter(function(r){
    return r.branch === b && (!g || r.grade === g); });
  return list.slice(0, 5).reverse();          /* results are newest first */
}
function formStrip(b, g, label_){
  var f = formFor(b, g);
  if(f.length < 2) return '';
  return '<div class="form"><span class="lbl">'+esc(label_ || 'Form')+'</span>' +
    f.map(function(r){ return '<i class="'+r.outcome+'">'+r.outcome+'</i>'; }).join('') + '</div>';
}

/* ---- hero ---- */
function renderNext(){
  var hero = document.getElementById('hero');
  var pool = upcoming().filter(function(f){ return branch==='all' || f.branch===branch; });
  if(!pool.length){ hero.hidden = true; } else {
    var f = pool[0], n = daysAway(f.date);
    hero.hidden = false;
    hero.style.setProperty('--crest', 'url(' + crestOf(f.branch) + ')');
    document.getElementById('heroLbl').textContent =
      mixed() ? (f.branch==='men' ? "Next match \u00b7 Men's" : 'Next match \u00b7 Ladies') : 'Next match';
    document.getElementById('heroCd').textContent =
      n===0 ? 'Today' : n===1 ? 'Tomorrow' : 'In ' + n + ' days';

    document.getElementById('sideA').innerHTML =
      '<img src="'+esc(crestOf(f.branch))+'" alt=""><b>Killeshin</b>';
    document.getElementById('sideB').innerHTML =
      '<span class="dot">v</span><b>'+esc(label(f.opponent, f.branch))+'</b>';

    var facts = [
      ['\u25CF', '<b>' + esc(f.time) + '</b> \u00b7 ' + esc(longDate(f.date))],
      ['\u25B3', esc(f.grade) + ' \u00b7 ' + esc(f.competition)]
    ];
      var mu = atHome(f) ? null : mapUrl(f.venue);
    facts.push(['\u25C6', (atHome(f) ? '<b>At home</b> \u00b7 ' + esc(f.venue) : '') +
      (mu ? '<a href="'+mu+'" target="_blank" rel="noopener">'+esc(f.venue)+'</a>' : '')]);
    if(f.referee && f.referee !== 'TBC') facts.push(['\u25CB', 'Referee ' + esc(f.referee)]);
    document.getElementById('heroFacts').innerHTML = facts.map(function(x){
      return '<div class="fact"><span class="k">'+x[0]+'</span><span>'+x[1]+'</span></div>'; }).join('');

    weather(f, document.getElementById('heroWx'), true);
  }

  var hm = upcoming().filter(function(f){
    return (branch==='all' || f.branch===branch) && atHome(f); })[0];
  var box = document.getElementById('athome');
  if(!hm || (pool.length && hm === pool[0])){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById('ahCrest').src = crestOf(hm.branch);
  document.getElementById('ahLine').textContent =
    (mixed() ? (hm.branch==='men' ? "Men's " : 'Ladies ') : '') +
    hm.grade + '  v  ' + label(hm.opponent, hm.branch);
  document.getElementById('ahSub').textContent =
    shortDate(hm.date) + '  \u00b7  ' + hm.time + '  \u00b7  ' + (DATA.ground || hm.venue);
  weather(hm, document.getElementById('ahWx'), false);
}

/* ---- weather: Killeshin, from the free open-meteo service ---- */
var WX = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',
  80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorms',96:'Thunderstorms',
  99:'Thunderstorms'};
function weather(match, el, big){
  if(!el) return;
  el.hidden = true; el.textContent = '';
  var n = daysAway(match.date);
  if(n < 0 || n > 14 || !/^\d{1,2}:\d{2}$/.test(match.time)) return;   /* forecast only reaches so far */

  var when = match.date + 'T' + (match.time.length === 4 ? '0' : '') + match.time;
  fetch('https://api.open-meteo.com/v1/forecast?latitude=52.85&longitude=-7.02' +
        '&hourly=temperature_2m,precipitation_probability,weather_code' +
        '&timezone=Europe%2FDublin&forecast_days=16')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var i = j.hourly.time.indexOf(when.slice(0,13) + ':00');
      if(i < 0) return;
      var t = Math.round(j.hourly.temperature_2m[i]);
      var rain = j.hourly.precipitation_probability[i];
      var sky = WX[j.hourly.weather_code[i]] || '';
      el.hidden = false;
      var text = sky + ', ' + t + '\u00b0C, ' + rain + '% chance of rain';
      el.innerHTML = big
        ? '<span style="opacity:.75">\u2601</span><span><b>Forecast</b> \u00b7 ' + esc(text) + '</span>'
        : esc('Forecast: ' + text);
    })
    .catch(function(){ /* no forecast, no fuss */ });
}

/* ---- fixtures ---- */
function renderFixtures(){
  var list = pick(upcoming());
  if(!list.length) return empty('Nothing down yet', emptyWhy('fixtures'));
  var html='', day=null;
  list.forEach(function(f){
    if(f.date!==day){
      day=f.date; var n=daysAway(f.date);
      html += '<div class="dayhead'+(n<=2?' soon':'')+'">' + esc(longDate(f.date)) +
              (n===0?' \u2014 today':n===1?' \u2014 tomorrow':'') + '</div>';
    }
    html += '<div class="card'+(atHome(f)?' hm':'')+'"><div class="row">' +
      '<div class="time num">'+esc(f.time)+'</div><div class="mid">' +
      '<div class="tt">'+mark(f)+teamLine(f)+'</div>' +
      '<div class="sub">'+esc(f.grade)+' \u00b7 '+esc(f.competition)+'<br>'+esc(f.venue)+
        (atHome(f)?' \u00b7 home':'')+'</div>' + directions(f) +
      '</div></div></div>';
  });
  return html;
}
function teamLine(m){
  var us = ourName(m.branch), H = m.home===us, A = m.away===us;
  return (H?'<b>':'')+esc(label(m.home,m.branch))+(H?'</b>':'') + ' v ' +
         (A?'<b>':'')+esc(label(m.away,m.branch))+(A?'</b>':'');
}

/* ---- results ---- */
function renderResults(){
  var list = pick(DATA.results);
  if(!list.length) return empty('No results yet', emptyWhy('results'));
  var html = '';
  if(branch !== 'all'){
    var f = formStrip(branch, grade === 'All' ? null : grade, 'Last 5');
    if(f) html += '<div class="card">' + f + '</div>';
  }
  var day=null;
  list.forEach(function(r){
    if(r.date!==day){ day=r.date; html += '<div class="dayhead">'+esc(longDate(r.date))+'</div>'; }
    var cls = r.outcome==='W' ? ' win' : r.outcome==='L' ? ' loss' : ' draw';
    html += '<div class="card'+cls+'">' +
      (mixed() ? '<div style="margin-bottom:7px">'+mark(r)+'</div>' : '') +
      scoreLine(r, r.home, r.homeScore, r.homeTotal, r.homeTotal>r.awayTotal) +
      scoreLine(r, r.away, r.awayScore, r.awayTotal, r.awayTotal>r.homeTotal) +
      '<div class="sub" style="font-size:13.5px;color:var(--grey);margin-top:8px">' +
      esc(r.grade)+' \u00b7 '+esc(r.competition)+'<br>'+esc(r.venue)+'</div></div>';
  });
  return html;
}
function scoreLine(m,n,sc,tot,won){
  return '<div class="sl'+(won?' w':'')+'"><div class="n">'+esc(label(n,m.branch))+'</div>' +
         '<div class="s dsp num">'+esc(sc)+'<em>'+tot+'</em></div></div>';
}

/* ---- tables ---- */
function renderTables(){
  var list = DATA.tables.filter(function(t){
    if(branch !== 'all' && t.branch !== branch) return false;
    return grade === 'All' || t.grade === grade;
  });
  if(!list.length) return empty('No table here',
    'Knockout and championship groups do not always run a league table.');
  return list.map(function(t){
    var us = ourName(t.branch);
    var rows = t.rows.map(function(r,i){
      return '<tr'+(r.team===us?' class="us"':'')+'><td class="t">' +
        '<span class="num" style="color:var(--grey-lt);margin-right:11px">'+(i+1)+'</span>' +
        esc(label(r.team,t.branch))+'</td><td class="num">'+r.p+'</td><td class="num">'+r.w+'</td>' +
        '<td class="num">'+r.d+'</td><td class="num">'+r.l+'</td><td class="num">'+r.f+'</td>' +
        '<td class="num">'+r.a+'</td><td class="p num">'+r.pts+'</td></tr>';
    }).join('');
    return '<section class="tbl"><div class="hd"><span class="lbl">' +
      (mixed() ? (t.branch==='men'?"Men's \u00b7 ":'Ladies \u00b7 ') : '') + esc(t.grade) + '</span>' +
      '<h3 class="dsp">'+esc(t.competition)+'</h3>' + formStrip(t.branch, t.grade) + '</div>' +
      '<table><thead><tr><th class="t">Team</th><th>P</th><th>W</th><th>D</th><th>L</th>' +
      '<th>F</th><th>A</th><th class="p">Pts</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
  }).join('');
}

/* ---- news ---- */
function renderNews(){
  var all = DATA.news || [];
  if(!all.length) return empty('Nothing in the papers',
    'Anything the local papers publish about Killeshin lands here within a day.');
  var free = all.filter(function(n){ return n.access !== 'subscriber'; });
  var paid = all.filter(function(n){ return n.access === 'subscriber'; });
  var html = '';
  if(free.length){
    html += sec('Free to read','Open these and read the whole story, no account needed.') +
      free.map(function(n,i){ return story(n, i===0); }).join('');
  } else {
    html += empty('Nothing free this week','The subscriber stories below are all that came up.');
  }
  if(paid.length){
    html += '<div class="paid">' +
      sec('Behind a subscription','You will hit a paywall on these. Headline and link only.') +
      paid.map(function(n){ return story(n,false); }).join('') + '</div>';
  }
  return html;
}
function sec(t,p){ return '<div class="sec"><span class="lbl">'+esc(t)+'</span><p>'+esc(p)+'</p></div>'; }
function story(n, lead){
  var age = -daysAway(n.date), when = shortDate(n.date);
  if(age === 0) when = 'Today'; else if(age === 1) when = 'Yesterday';
  else if(age > 1 && age < 7) when = age + ' days ago';
  return '<a class="story'+(lead?' lead':'')+'" href="'+esc(n.url)+'" target="_blank" rel="noopener">' +
    '<h3>'+esc(n.title)+'</h3><div class="by"><b>'+esc(n.source)+'</b> <s>\u00b7</s> '+esc(when) +
    (n.tag ? ' <s>\u00b7</s> '+esc(n.tag) : '') +
    (n.access==='subscriber' ? ' <s>\u00b7</s> Subscribers' : '') + '</div></a>';
}

/* ---- alerts ---- */
function renderAlerts(){
  var host = location.host + location.pathname.replace(/[^/]*$/,'');
  var feeds = [['all','Every Killeshin match'],['men',"Men's fixtures only"],
               ['ladies','Ladies fixtures only'],['home','Home games only']];
  return '<div class="panel"><span class="lbl">Match alerts</span>' +
    '<h2 class="dsp">Get a reminder before every game</h2>' +
    '<p>Tap one below and your phone adds a Killeshin calendar. Every fixture appears ' +
    'automatically with <b>an alert two hours before throw-in</b>. New fixtures land in it ' +
    'on their own \u2014 you only do this once.</p>' +
    feeds.map(function(f,i){
      return '<a class="btn'+(i?' alt':'')+'" href="webcal://'+esc(host)+'killeshin-'+f[0]+'.ics">' +
             esc(f[1]) + '</a>'; }).join('') +
    '<p class="fine"><b>iPhone:</b> tap a button, then Subscribe. <b>Android:</b> copy the link ' +
    'into Google Calendar under Other calendars \u2192 From URL.<br><br>' +
    'Times come from the county boards. If a game is moved the calendar moves with it \u2014 ' +
    'but always check with the manager on the day.</p></div>';
}

/* ---- club ---- */
function renderClub(){
  var links = (DATA.club && DATA.club.links) || [];
  if(!links.length) return empty('Nothing here yet', 'Club links can be added to the data block.');
  var groups = {}, order = [];
  links.forEach(function(l){
    if(!groups[l.group]){ groups[l.group] = []; order.push(l.group); }
    groups[l.group].push(l);
  });
  return order.map(function(g){
    return '<div class="sec"><span class="lbl">'+esc(g)+'</span></div>' +
      groups[g].map(function(l){
        return '<a class="act" href="'+esc(l.url)+'" target="_blank" rel="noopener">' +
          '<span class="ic">'+esc(l.mark)+'</span><span class="tx"><b>'+esc(l.title)+'</b>' +
          '<span>'+esc(l.note)+'</span></span><span class="go">\u2192</span></a>';
      }).join('');
  }).join('') +
  '<p class="fine" style="padding:0 4px">These open the club\u2019s own pages in a new tab. ' +
  'Payments are handled there, never in this app.</p>';
}

function emptyWhy(kind){
  var who = branch==='men' ? "the men's teams" : branch==='ladies' ? 'the ladies teams' : 'any team';
  if(homeOnly) return 'No home ' + kind + ' match that filter. Turn off Home only to see away games too.';
  if(grade !== 'All') return 'Nothing for ' + grade + ' right now. Try another team above.';
  return kind === 'fixtures'
    ? 'Nothing down for ' + who + ' yet. New fixtures appear the morning after the county board publishes them.'
    : 'Once ' + who + ' play, the scores show up here.';
}
function empty(title,msg){
  return '<div class="empty"><img src="'+crestOf(branch==='ladies'?'ladies':'men')+'" alt="">' +
         '<b>'+esc(title)+'</b><span>'+esc(msg)+'</span></div>';
}

/* ---- shell ---- */
function grades(){
  var G = DATA.gradesBy || {};
  if(branch === 'all'){
    var seen = {}, out = [];
    ['men','ladies'].forEach(function(b){
      (G[b]||[]).forEach(function(g){ if(!seen[g]){ seen[g]=1; out.push(g); } }); });
    return out;
  }
  return G[branch] || [];
}
function filters(){
  var box = document.getElementById('filters');
  if(view === 'news' || view === 'alerts' || view === 'club'){ box.hidden = true; return; }
  box.hidden = false;
  var chips = ['All'].concat(grades()).map(function(g){
    return '<button class="chip" aria-pressed="'+(g===grade)+'" data-g="'+esc(g)+'">'+esc(g)+'</button>';
  }).join('');
  box.innerHTML = chips + (view === 'tables' ? '' :
    '<button class="home-t" id="homeT" aria-pressed="'+homeOnly+'">Home only</button>');
}
function drawInner(){
  document.getElementById('out').innerHTML =
    view==='fixtures' ? renderFixtures() :
    view==='results'  ? renderResults()  :
    view==='tables'   ? renderTables()   :
    view==='news'     ? renderNews()     :
    view==='alerts'   ? renderAlerts()   : renderClub();
}
function draw(){
  try { drawInner(); filters(); }
  catch(err){
    console.error(err);
    document.getElementById('out').innerHTML =
      empty('Something went wrong', 'Pull down to refresh.');
  }
  window.scrollTo(0,0);
}
document.getElementById('branch').addEventListener('click', function(e){
  var b = e.target.closest('.br'); if(!b) return;
  branch = b.dataset.b;
  if(grade !== 'All' && grades().indexOf(grade) === -1) grade = 'All';
  document.querySelectorAll('.br').forEach(function(x){
    x.setAttribute('aria-pressed', String(x.dataset.b === branch)); });
  document.getElementById('mastCrest').src = crestOf(branch==='ladies'?'ladies':'men');
  document.getElementById('mastSub').textContent =
    branch==='men' ? 'CLG Gleann Uiseann' : branch==='ladies' ? 'Killeshin Ladies' : "Men's and ladies";
  renderNext(); draw();
});
document.getElementById('filters').addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if(c){ grade = c.dataset.g; draw(); return; }
  if(e.target.closest('#homeT')){ homeOnly = !homeOnly; draw(); }
});
document.querySelector('.tabs').addEventListener('click', function(e){
  var t = e.target.closest('.tab'); if(!t) return;
  view = t.dataset.view;
  document.querySelectorAll('.tab').forEach(function(x){
    x.setAttribute('aria-selected', String(x === t)); });
  draw();
});
function stamp(){
  var u = new Date(DATA.updated);
  var same = u.toDateString() === new Date().toDateString();
  document.getElementById('stamp').textContent = 'Updated ' +
    (same ? 'today at ' + u.toTimeString().slice(0,5) : shortDate(DATA.updated.slice(0,10)));
}

/* ---- visitor counter ----
   A free third-party tally. If it is ever unreachable the badge simply
   stays hidden rather than showing a broken number. */
function counter(){
  var el = document.getElementById('count');
  fetch('https://api.counterapi.dev/v1/killeshingaa/app/up')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var n = j && (j.count != null ? j.count : j.value);
      if(n == null) return;
      el.hidden = false;
      el.textContent = '\u25C9 ' + Number(n).toLocaleString() + ' visits';
    })
    .catch(function(){ /* leave it hidden */ });
}

function boot(){
  try { renderNext(); } catch(err){ console.error(err);
    document.getElementById('hero').hidden = true;
    document.getElementById('athome').hidden = true; }
  draw();
  try { stamp(); } catch(err){ console.error(err); }
}
boot();
counter();

/* Data lives in the seed block above. update.py rewrites it in place, so
   there is no second file to fall out of step with this one. */
})();
</script>
</body>
</html>
