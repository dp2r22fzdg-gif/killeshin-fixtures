<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Killeshin GAA — Fixtures, Results &amp; News</title>
<meta name="description" content="Every Killeshin fixture, result, league table and news story — men's and ladies, senior down to U12. Updated hourly.">
<meta name="theme-color" content="#1F824A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Killeshin GAA">
<link rel="apple-touch-icon" href="crest.png">
<link rel="icon" href="crest.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- GoatCounter: visitor stats at https://killeshin.goatcounter.com
     No cookies, so no consent banner needed. -->
<script data-goatcounter="https://killeshin.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Deep near-black green for the dark areas, a brighter green for accents.
     The old mid-green read flat on a phone. */
  --deep:#11492E; --deep-2:#1D5C3C; --forest:#1F824A;
  --green:#3ACD77; --green-dk:#12703F; --green-lt:#E8F6EE;
  --ink:#101A14; --grey:#4E5A53; --grey-lt:#6B7A72;
  --line:#E2EAE5; --line-dk:#C2D0C7; --paper:#fff; --paper-2:#EFF4F0;
  --r:20px; --r-sm:13px;
  --crest:url(crest.png);
}
/* Green and white flecks: fine diagonal streaks laid over the dark panels.
   Two passes at different angles so it never looks like stripes. */
.flecked{position:relative;overflow:hidden}
.flecked::before{content:"";position:absolute;inset:-20%;pointer-events:none;
  background:
    repeating-linear-gradient(114deg,
      rgba(255,255,255,.055) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(114deg,
      rgba(58,205,119,.16) 0 2px, transparent 2px 34px),
    repeating-linear-gradient(66deg,
      rgba(255,255,255,.028) 0 1px, transparent 1px 17px);
  opacity:.9}
.flecked>*{position:relative;z-index:1}
*{box-sizing:border-box}
/* An explicit display: beats the hidden attribute, which has left empty
   boxes on the page twice now. This settles it for every element. */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper-2);color:var(--ink);
  font-family:Archivo,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.55;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:10px}
.dsp{font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif;font-weight:800;
  letter-spacing:-.03em;line-height:1.02}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ── masthead: the crest given room ─────────────────────── */
.mast{color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 24px;
  display:flex;align-items:center;gap:16px;border-radius:0 0 28px 28px;
  background:
    linear-gradient(150deg, rgba(17,73,46,.76) 0%, rgba(17,73,46,.87) 68%),
    url(ground.jpg) center 38%/cover no-repeat, var(--deep)}
.mast .badge{width:72px;height:72px;flex:none;background:#fff;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 3px rgba(58,205,119,.6)}
.mast .badge img{width:70%;height:70%;object-fit:contain;display:block}
.mast h1{font-size:25px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;line-height:1}
.mast span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.28em;
  text-transform:uppercase;color:#7FCFA2;margin-top:8px}

/* ── branch switch: three big, obvious buttons ──────────── */
.branch{display:flex;gap:9px;padding:16px 16px 4px;margin-top:-16px}
.br{flex:1;background:var(--paper);border-radius:16px;padding:14px 6px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-size:13.5px;font-weight:700;color:var(--ink);
  border:1px solid var(--line);box-shadow:0 3px 12px rgba(17,73,46,.09);
  position:relative;overflow:hidden}
.br img{width:32px;height:32px;object-fit:contain;display:block}
.br .pair{display:flex;align-items:center;height:32px}
.br .pair img{width:26px;height:26px}
.br .pair img + img{margin-left:-8px}
.br[aria-pressed="true"] img{filter:brightness(0) invert(1)}
.br[aria-pressed="true"]{background:var(--forest);color:#fff;border-color:var(--deep)}
.br[aria-pressed="true"]::after{content:"";position:absolute;left:26%;right:26%;bottom:7px;
  height:3px;border-radius:999px;background:var(--green)}
.br:active{transform:translateY(1px)}

/* ── next match ─────────────────────────────────────────── */
.wrap{padding:14px 16px 0}
.hero{background:linear-gradient(160deg,var(--deep-2) 0%,var(--deep) 62%);
  color:#fff;border-radius:24px;padding:20px 18px 18px;
  box-shadow:0 8px 26px rgba(17,73,46,.22)}
.hero .cap{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .cap .lbl{color:#8FD6AE;letter-spacing:.22em;font-size:10.5px}
.hero .cap .cd{display:inline-flex;align-items:center;gap:8px;background:var(--green);
  color:#04240F;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;white-space:nowrap}
.hero .cap .cd svg{width:14px;height:14px;stroke:#04240F;stroke-width:2.1;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* crest, name, V, opponent - the shape of a matchday poster */
.vs{display:flex;align-items:center;gap:14px;margin:24px 0 18px}
.vs .crest{width:78px;height:78px;flex:none;background:#fff;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 0 0 3px rgba(58,205,119,.55)}
.vs .crest img{width:69%;height:69%;object-fit:contain;display:block}
/* Where the county board has no crest for a club, a monogram in their place.
   Looks deliberate rather than like a missing image. */
.vs .mono{width:78px;height:78px;flex:none;border-radius:50%;display:grid;
  place-items:center;background:#fff;box-shadow:0 0 0 3px rgba(58,205,119,.55);
  font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  color:var(--deep);letter-spacing:.01em;line-height:1;position:relative}
.vs .mono span{position:relative;z-index:1;font-size:26px}
.vs .mono.long span{font-size:21px}
.vs .mono::before{content:"";position:absolute;inset:7px;border-radius:50%;
  border:1.5px solid rgba(17,73,46,.16)}
.vs .names{flex:1;min-width:0;text-align:center}
.vs .names b{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;
  font-weight:800;font-size:22px;letter-spacing:.05em;text-transform:uppercase;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis}
.vs .names i{display:block;font-style:normal;color:var(--green);font-weight:800;
  font-size:15px;margin:5px 0;letter-spacing:.2em}
.vs .names b.them{color:#CFE8DA;font-size:19px}

.hero .comp{text-align:center;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#8FD6AE;padding-bottom:16px;line-height:1.6}
.meta{display:flex;gap:2px;border-top:1px solid rgba(255,255,255,.16);padding-top:15px}
.meta .m{flex:1;min-width:0;display:flex;gap:9px;align-items:flex-start;padding:0 6px}
.meta .m + .m{border-left:1px solid rgba(255,255,255,.14)}
.meta svg{width:17px;height:17px;flex:none;stroke:var(--green);stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.meta .m b{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.meta .m span{display:block;font-size:12px;color:#A9CFBB;margin-top:2px;line-height:1.35}
.heroref{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.16);font-size:13px;color:#D7EEDF}
.heroref svg{width:16px;height:16px;flex:none;stroke:#8FD6AE;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.hero .dir{background:rgba(58,205,119,.2);color:#C9F0DA;margin-top:15px;
  border:1px solid rgba(58,205,119,.45)}
.hero .wx{margin-top:14px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);border-radius:var(--r-sm);
  padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;line-height:1.4}
.hero .wx[hidden]{display:none}
.hero .wx .ico{font-size:20px;flex:none}
.hero .wx b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:#8FD6AE;margin-bottom:2px}
.hero .wx .soft{color:#DCEFE4}

/* ── next at home ───────────────────────────────────────── */
/* Given real weight - it is the one fixture most people care about, and it
   was disappearing as a plain white card between two strong panels. */
.athome{margin:12px 16px 0;border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#F2FBF6 0%,#E4F5EB 100%);
  border:1px solid rgba(31,130,74,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 5px 18px -6px rgba(17,73,46,.24)}
.athome::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--green),var(--green-dk))}
.athome::after{content:"";position:absolute;right:-24px;bottom:-28px;width:118px;height:118px;
  background:var(--crest) no-repeat center/contain;opacity:.05;pointer-events:none}
.athome .top{display:flex;align-items:center;gap:9px;padding:11px 16px 10px 19px;
  background:linear-gradient(90deg,rgba(31,130,74,.14),rgba(31,130,74,.03));
  border-bottom:1px solid rgba(31,130,74,.16);position:relative;z-index:1}
.athome .top svg{width:15px;height:15px;stroke:var(--green-dk);stroke-width:2.1;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.athome .lbl{color:var(--green-dk);letter-spacing:.19em;font-size:10.5px}
.athome .body{display:flex;gap:14px;align-items:flex-start;padding:15px 16px 16px 19px;
  position:relative;z-index:1}
.athome img{width:54px;height:54px;object-fit:contain;flex:none}
.athome .l{font-size:18px;font-weight:800;line-height:1.25;letter-spacing:-.01em;
  font-family:'Bricolage Grotesque',Archivo,sans-serif}
.athome .s{font-size:13.5px;color:var(--grey);margin-top:6px;display:flex;
  align-items:center;gap:8px;line-height:1.4}
.athome .s svg{width:15px;height:15px;flex:none;stroke:var(--green-dk);stroke-width:1.9;
  fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── promo strip ────────────────────────────────────────── */
/* White, so it does not fight the dark match panel above it, with the club
   green carrying the accent. Reads as club business, not another fixture. */
.promo{display:block;margin:12px 16px 0;padding:0;text-decoration:none;
  background:var(--paper);border-radius:20px;border:1px solid var(--line);
  box-shadow:0 3px 14px rgba(17,73,46,.09);overflow:hidden;position:relative}
.promo .strap{display:flex;align-items:center;gap:9px;
  background:linear-gradient(90deg,var(--deep) 0%,var(--forest) 100%);
  padding:9px 16px;color:#fff}
.promo .strap svg{width:15px;height:15px;stroke:var(--green);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.promo .strap span{font-size:10.5px;font-weight:800;letter-spacing:.19em;
  text-transform:uppercase}
.promo .inner{display:flex;align-items:center;gap:14px;padding:15px 16px 16px}
.promo .tx{flex:1;min-width:0}
.promo .tx b{display:block;font-size:17.5px;font-weight:800;line-height:1.25;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;letter-spacing:-.01em;color:var(--ink)}
.promo .tx span{display:block;font-size:13px;color:var(--grey);margin-top:4px;line-height:1.45}
.promo .cta{flex:none;display:inline-flex;align-items:center;gap:7px;
  background:var(--green-lt);color:var(--green-dk);border:1px solid #BFDFCD;
  border-radius:999px;padding:9px 15px;font-size:13px;font-weight:800;white-space:nowrap}
.promo:active{transform:translateY(1px)}

/* ── nav ────────────────────────────────────────────────── */
/* Not pinned. At four rows tall it would cover half the screen and sit on
   top of short panels like Alerts. It scrolls away with everything else. */
.nav{background:var(--paper-2);padding-top:14px;
  scroll-margin-top:calc(env(safe-area-inset-top) + 10px)}
/* Bottom bar, the way a native app does it. Four everyday tabs plus More,
   which opens the rest in a sheet. Always in reach of a thumb. */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;
  grid-template-columns:repeat(5,1fr);
  background:rgba(17,73,46,.96);-webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.1);
  padding-bottom:env(safe-area-inset-bottom)}
.bar button{display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 2px 8px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:#F0F7F3}
.bar svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.bar button{position:relative}
.bar button[aria-selected="true"]{color:#FFFFFF;font-weight:800}
.bar button[aria-selected="true"] svg{stroke-width:2.4;stroke:var(--green)}
.bar button[aria-selected="true"]::before{content:"";position:absolute;top:0;
  left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:var(--green)}
.bar button:active{opacity:.55}

.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;
  background:rgba(10,30,20,.4);opacity:0;pointer-events:none;transition:opacity .16s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet .panel{width:100%;background:var(--paper-2);border-radius:24px 24px 0 0;
  padding:10px 16px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(14px);transition:transform .16s}
.sheet.open .panel{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:999px;background:var(--line-dk);
  margin:0 auto 16px}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:15px 17px;margin-bottom:9px;border-radius:14px;font-size:16.5px;font-weight:700;
  background:var(--green-lt);color:var(--green-dk);border:1.5px solid #BFDFCD;
  box-shadow:0 3px 0 #BFDFCD}
.sheet button:active{box-shadow:0 1px 0 #BFDFCD;transform:translateY(2px)}
.sheet button[aria-selected="true"]{background:var(--forest);color:#fff;border-color:#0F5C34;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28)}
.sheet button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Teams on one line, Home only on its own beneath, so the toggle is always
   in view rather than off the end of a scrolling row. */
.filters{display:block;padding:12px 0 4px;min-height:52px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.homerow{display:flex;align-items:center;gap:9px;padding:10px 16px 0;flex-wrap:wrap}
.filters[hidden]{display:none}
.chip{flex:none;font-size:13.5px;font-weight:600;color:var(--green-dk);white-space:nowrap;
  padding:7px 15px;border-radius:10px;background:var(--green-lt);border:1px solid #BFDFCD;
  box-shadow:0 2px 0 #BFDFCD}
.chip:active{box-shadow:0 0 0 #BFDFCD;transform:translateY(2px)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3);transform:translateY(1px)}
.home-t{flex:none;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;
  color:var(--green-dk);white-space:nowrap;padding:7px 15px 7px 13px;background:var(--green-lt);
  border:1px solid #BFDFCD;border-radius:10px;box-shadow:0 2px 0 #BFDFCD}
.home-t::before{content:"";width:8px;height:8px;border-radius:50%;background:#8FC3A4}
.home-t:active{box-shadow:none;transform:translateY(2px)}
.home-t[aria-pressed="true"]{color:#fff;background:var(--green-dk);border-color:#0F5C34;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.3);transform:translateY(1px)}
.home-t[aria-pressed="true"]::before{background:#fff}

/* ── my teams ───────────────────────────────────────────── */
.mine-btn{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;
  font-weight:700;white-space:nowrap;padding:7px 15px 7px 13px;border-radius:10px;
  background:var(--green-lt);color:var(--green-dk);border:1px solid #BFDFCD;
  box-shadow:0 2px 0 #BFDFCD}
.mine-btn:active{box-shadow:none;transform:translateY(2px)}
.mine-btn .star{font-size:14px;line-height:1}

/* Buy tickets: same shape as Home only / My teams, but amber - matching the
   ticket pill already used on fixture cards. */
.ticket-t{flex:none;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;
  font-weight:700;white-space:nowrap;padding:7px 15px 7px 13px;border-radius:10px;
  color:#7A5210;background:linear-gradient(180deg,#FFFDF6,#FBF1DC);
  border:1px solid rgba(184,125,18,.4);box-shadow:0 2px 0 rgba(184,125,18,.3)}
.ticket-t:active{box-shadow:none;transform:translateY(2px)}

/* On the filtered page the team chips would sit there doing nothing, so they
   are replaced by a banner saying whose games these are. */
.minebar{display:flex;align-items:center;gap:11px;margin:0 16px;padding:11px 14px;
  border-radius:14px;background:linear-gradient(160deg,#F2FBF6,#E4F5EB);
  border:1px solid rgba(31,130,74,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.minebar .star{font-size:16px;color:var(--green-dk);flex:none}
.minebar .tx{flex:1;min-width:0}
.minebar .tx b{display:block;font-size:10.5px;font-weight:800;letter-spacing:.15em;
  text-transform:uppercase;color:var(--green-dk)}
.minebar .tx span{display:block;font-size:13.5px;color:var(--ink);font-weight:600;
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine-alt{flex:none;padding:7px 13px;border-radius:10px;font-size:13px;font-weight:700;
  color:var(--green-dk);background:#fff;border:1px solid #BFDFCD;box-shadow:0 2px 0 #BFDFCD}
.mine-alt:active{box-shadow:none;transform:translateY(2px)}

.picker .panel{max-height:78vh;overflow-y:auto}
.picker h3{font-size:19px;font-family:'Bricolage Grotesque',Archivo,sans-serif;
  font-weight:800;margin:0 0 4px}
.picker .lead-in{font-size:13.5px;color:var(--grey);margin:0 0 16px;line-height:1.5}
.picker .grp{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--green-dk);margin:16px 0 8px;display:flex;align-items:center;gap:9px}
.picker .grp img{width:22px;height:22px;object-fit:contain}
.pick{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 15px;margin-bottom:7px;border-radius:12px;font-size:16px;font-weight:600;
  background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.pick .box{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line-dk);
  display:grid;place-items:center;font-size:14px;color:#fff;background:#fff}
.pick[aria-pressed="true"]{background:var(--green-lt);border-color:#BFDFCD;
  color:var(--green-dk);font-weight:700}
.pick[aria-pressed="true"] .box{background:var(--green);border-color:var(--green-dk)}
.picker .done{display:block;width:100%;padding:15px;border-radius:12px;margin-top:14px;
  background:var(--forest);color:#fff;font-size:15px;font-weight:800;
  border:1.5px solid #0F5C34;box-shadow:0 3px 0 #0F5C34}
.picker .done:active{box-shadow:0 1px 0 #0F5C34;transform:translateY(2px)}
.picker .clear{display:block;width:100%;text-align:center;padding:12px;margin-top:8px;
  font-size:13.5px;font-weight:700;color:var(--grey)}

/* ── lists: soft cards, no hard rules ───────────────────── */
main{padding:8px 16px 20px;min-height:60vh}
@keyframes swap{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
main.swap{animation:swap .19s cubic-bezier(.22,.61,.36,1)}
@media (prefers-reduced-motion:reduce){main.swap{animation:none}}
/* Day heading with a rule running off to the right, so the eye finds the
   date without it shouting. */
.dayhead{display:flex;align-items:center;gap:11px;padding:20px 2px 10px;
  font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grey)}
.dayhead::after{content:"";flex:1;height:1px;background:var(--line-dk)}
.dayhead.soon{color:var(--green-dk)}
.dayhead.soon::after{background:#BFDFCD}
.card{background:linear-gradient(176deg,#FDFBF2 0%,#F7F3E1 45%,#E9F1EA 100%);
  border-radius:18px;padding:14px 15px;margin-bottom:9px;
  border:1px solid rgba(17,73,46,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 2px rgba(17,73,46,.05),
             0 6px 16px -6px rgba(17,73,46,.16);
  position:relative;overflow:hidden}
/* Crest watermark, quieter than before so it reads as paper texture. */
.card::after{content:"";position:absolute;right:-18px;bottom:-22px;width:96px;height:96px;
  background:var(--crest) no-repeat center/contain;opacity:.032;pointer-events:none}
.card.lad::after{background-image:url(crest-ladies.png)}
.card>*{position:relative;z-index:1}

/* Last three results as W, D and L in the usual colours. Newest on the right. */
.fdots{display:flex;gap:3px;flex:none}
.fdots i{width:18px;height:18px;border-radius:50%;font-style:normal;display:grid;
  place-items:center;font-size:10.5px;font-weight:800;color:#fff;
  font-family:Archivo,Arial,sans-serif;line-height:1;
  box-shadow:0 1px 2px rgba(17,73,46,.22)}
.fdots i.W{background:#19924B}                     /* won */
.fdots i.D{background:#B87D12}                     /* drew */
.fdots i.L{background:#C7443B}                     /* lost */

.mini{width:44px;height:44px;border-radius:50%;background:#fff;flex:none;
  display:grid;place-items:center;overflow:hidden;
  border:1px solid rgba(17,73,46,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(17,73,46,.12)}
.mini.us{border-color:rgba(31,130,74,.45);z-index:2}
.mini img{width:76%;height:76%;object-fit:contain;display:block}
.mini b{font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:14px;color:var(--deep);letter-spacing:.01em;line-height:1}
.mini b.long{font-size:10.5px}

.gchip{flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;letter-spacing:.05em;
  background:linear-gradient(180deg,#FFFFFF,#F1F7F3);color:var(--deep);
  border:1px solid rgba(17,73,46,.14);border-radius:8px;padding:3px 9px;
  box-shadow:0 1px 2px rgba(17,73,46,.06);line-height:1.5}
.venue{display:flex;gap:8px;align-items:baseline;margin-top:6px}
.venue::before{content:"\25C6";font-size:8px;color:var(--green);opacity:.7;
  position:relative;top:-1px}

/* ── fixture card ───────────────────────────────────────── */
/* Laid out top to bottom in the order people read a fixture: which team and
   what time, who is playing, then where. Each team gets its own line with
   room for the full club name, rather than squeezing both into one sentence. */
.card.fx{padding:15px 16px 16px}
.card.fx.hm{padding-left:20px;border-color:rgba(31,130,74,.24)}
.card.fx.hm::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--green),var(--green-dk))}
.fx-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px}
.fx-tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.fx-tags .bm,.fx-tags .flagbadge{margin:0}
.fx-grade{flex:none;display:inline-flex;align-items:center;
  font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;font-size:17px;
  letter-spacing:-.01em;line-height:1;color:#fff;padding:7px 13px;border-radius:10px;
  background:linear-gradient(180deg,var(--deep-2),var(--deep));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 2px 6px -2px rgba(17,73,46,.5)}
.card.lad .fx-grade{background:linear-gradient(180deg,#1C8A4E,var(--green-dk))}
.fx-ha{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;line-height:1.5;border:1px solid}
.fx-ha.h{background:var(--green-dk);color:#fff;border-color:var(--green-dk)}
.fx-ha.a{background:#fff;color:var(--grey);border-color:var(--line-dk)}
.fx-ha.n{background:#FBF1DC;color:#7A5210;border-color:rgba(184,125,18,.4)}
.fx-time{flex:none;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:25px;line-height:1;letter-spacing:-.02em;color:var(--deep)}
.fx-teams{display:flex;flex-direction:column;gap:10px;padding:12px 0;
  border-top:1px solid rgba(17,73,46,.1);border-bottom:1px solid rgba(17,73,46,.1)}
.fx-team{display:flex;align-items:center;gap:12px}
.fx-team .mini{width:40px;height:40px}
.fx-name{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.25;color:var(--ink)}
.fx-team.us .fx-name{font-weight:800;color:var(--deep)}
.fx-comp{font-size:14px;color:var(--grey);line-height:1.45;margin-top:11px}
.fx-line{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:15px;
  font-weight:600;color:var(--ink);line-height:1.4}
.fx-line.ref{font-size:13.5px;font-weight:500;color:var(--grey)}
.fx-line svg{width:17px;height:17px;flex:none;margin-top:1px;stroke:var(--green-dk);
  stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fx-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.fx-act .tick,.fx-act .dir{margin-right:0}

/* UPDATED flag, inline so it never overlaps other content on a narrow screen. */
.flagbadge{display:inline-flex;align-items:center;font-size:9.5px;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:999px;
  margin-right:8px;vertical-align:2px;color:#fff}
.flagbadge.upd{background:#B87D12}
/* Ticket needed - a quiet amber so it reads as information, not alarm. */
.tick{display:inline-flex;align-items:center;gap:6px;margin-top:10px;margin-right:8px;
  font-size:12.5px;font-weight:700;color:#7A5210;
  background:linear-gradient(180deg,#FFFDF6,#FBF1DC);
  border:1px solid rgba(184,125,18,.4);border-radius:999px;padding:6px 13px;
  box-shadow:0 1px 2px rgba(122,82,16,.12)}
.tick:active{box-shadow:none;transform:translateY(1px)}
.hero .tick{background:rgba(255,214,120,.18);color:#FFE7B0;
  border-color:rgba(255,214,120,.45)}
.dir{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;
  font-weight:700;color:var(--green-dk);
  background:linear-gradient(180deg,#FFFFFF,#EAF6EF);
  border:1px solid rgba(31,130,74,.26);border-radius:999px;padding:6px 13px;
  box-shadow:0 1px 2px rgba(17,73,46,.07)}
.dir:active{box-shadow:none;transform:translateY(1px)}
.bm{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;
  border-radius:999px;margin-right:8px;vertical-align:1px}
.bm.men{background:var(--forest);color:#fff}
.bm.ladies{background:var(--green);color:#fff}

.card.win::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--green)}
.card.loss::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line-dk)}
.card.draw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grey-lt)}
.card.win,.card.loss,.card.draw{padding-left:19px}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-bottom:9px}
.obadge{font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 11px;border-radius:999px}
.obadge.W{background:var(--green);color:#fff}
.obadge.L{background:var(--paper-2);color:var(--grey);border:1px solid var(--line-dk)}
.obadge.D{background:var(--grey-lt);color:#fff}
.sl{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:4px 0}
.sl .n{font-size:16px;font-weight:500;color:var(--grey);min-width:0;
  display:flex;align-items:center;gap:10px}
.sl .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .n .mini{width:30px;height:30px;flex:none}
.sl .n .mini b{font-size:10.5px}
.sl .n .mini b.long{font-size:9px}
.sl.w .n{color:var(--ink);font-weight:700}
.sl .s{font-size:20px;flex:none;color:var(--grey)}
.sl.w .s{color:var(--ink)}
.sl .s em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--grey-lt);
  margin-left:7px;font-family:Archivo,Arial,sans-serif;letter-spacing:0}

/* ── form guide ─────────────────────────────────────────── */
.form{display:flex;align-items:center;gap:7px;margin-top:4px}
.form .lbl{color:var(--grey-lt);font-size:10.5px}
.form i{width:23px;height:23px;border-radius:50%;font-style:normal;font-size:11.5px;
  font-weight:700;display:grid;place-items:center;color:#fff}
.form i.W{background:var(--green)}
.form i.L{background:var(--line-dk);color:var(--grey)}
.form i.D{background:var(--grey-lt)}

/* ── tables ─────────────────────────────────────────────── */
.tbl{background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border-radius:var(--r);margin-bottom:10px;overflow:hidden;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.tbl .hd{padding:17px 18px 13px}
.tbl .hd h3{font-size:17px;line-height:1.3}
.tbl .hd .lbl{color:var(--green-dk);margin-bottom:7px;display:block}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--grey-lt);text-align:right;padding:9px 3px 9px;background:var(--paper-2)}
th.t,td.t{text-align:left;width:100%;padding-left:18px}
td.t{font-weight:500}
th.p,td.p{padding-right:18px}
td{padding:13px 3px;text-align:right;border-top:1px solid var(--line);color:var(--grey)}
td.t,td.p{color:var(--ink)}
td.p{font-weight:700}
tr.us td{background:var(--green-lt);color:var(--ink);font-weight:700}

/* ── record: a scoreboard of the season ─────────────────── */
.sb{background:var(--forest);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:10px;
  position:relative;overflow:hidden;box-shadow:0 4px 18px rgba(26,122,72,.2)}
.sb::after{content:"";position:absolute;right:-56px;bottom:-56px;width:210px;height:210px;
  background:var(--crest) no-repeat center/contain;filter:brightness(0) invert(1);
  opacity:.08;pointer-events:none}
.sb>*{position:relative;z-index:1}
.sb .lbl{color:#DDF2E6;display:block;margin-bottom:14px}
.sb .big{display:flex;gap:10px}
.sb .big div{flex:1;background:rgba(255,255,255,.14);border-radius:var(--r-sm);
  padding:13px 8px;text-align:center}
.sb .big div.wins{background:#fff;color:var(--green-dk)}
.sb .big u{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:34px;line-height:1;text-decoration:none;font-variant-numeric:tabular-nums}
.sb .big span{display:block;font-size:11px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;margin-top:6px;opacity:.85}
.sb .tot{margin-top:14px;font-size:14px;color:#DDF2E6}
.sb .tot b{color:#fff;font-weight:700}

.gr{border-radius:var(--r);padding:15px 17px;margin-bottom:9px;display:flex;
  align-items:center;gap:14px;border:1px solid #DFEBE3;
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.gr .nm{flex:1;min-width:0}
.gr .nm b{display:block;font-size:16.5px;font-weight:700}
.gr .nm span{display:block;font-size:13px;color:var(--grey);margin-top:2px}
.gr .w{flex:none;text-align:center;min-width:56px}
.gr .w u{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:27px;line-height:1;text-decoration:none;color:var(--green-dk);
  font-variant-numeric:tabular-nums}
.gr .w span{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--grey-lt);margin-top:3px}
.gr.none .w u{color:var(--line-dk)}
.bhead{display:flex;align-items:center;gap:11px;padding:20px 4px 12px}
.bhead img{width:34px;height:34px;object-fit:contain}
.hint{margin:14px 4px 4px;font-size:13.5px;color:var(--grey);line-height:1.5;
  background:var(--green-lt);border-radius:var(--r-sm);padding:12px 14px}
.bhead b{font-size:19px;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800}

/* ── record: expandable analysis ────────────────────────── */
.gr{cursor:pointer}
.gr .go{flex:none;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;color:var(--green-dk);
  background:var(--green-lt);border-radius:999px;padding:6px 11px 6px 12px;white-space:nowrap}
.gr .go em{font-style:normal;font-size:14px;line-height:1;transition:transform .15s;display:block}
.gr[aria-expanded="true"] .go{background:var(--forest);color:#fff}
.gr[aria-expanded="true"] .go em{transform:rotate(90deg)}
.gr:active{transform:translateY(1px)}
.gr[aria-expanded="true"]{border-bottom-left-radius:0;border-bottom-right-radius:0;
  margin-bottom:0;box-shadow:0 -2px 10px rgba(20,60,40,.05)}
.an{background:var(--paper);border-radius:0 0 var(--r) var(--r);padding:2px 17px 18px;
  margin-bottom:9px;box-shadow:0 2px 10px rgba(20,60,40,.05)}
.ktabs{display:flex;gap:8px;padding:14px 0 4px}
.ktabs button{flex:1;padding:10px 8px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:var(--green-lt);color:var(--green-dk);border:1.5px solid #BFDFCD;
  box-shadow:0 3px 0 #BFDFCD;transform:translateY(-1px)}
.ktabs button:active{box-shadow:0 1px 0 #BFDFCD;transform:translateY(1px)}
.ktabs button[aria-pressed="true"]{background:var(--forest);color:#fff;border-color:#0F5C34;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.28);transform:translateY(1px)}
.konly{padding:14px 0 2px;font-size:12.5px;font-weight:600;color:var(--grey-lt)}
.an .form{margin:14px 0 0}
.an .rate{display:flex;align-items:center;gap:13px;padding:14px 0 16px;
  border-top:1px solid var(--line)}
.an .rate u{font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:31px;text-decoration:none;line-height:1;color:var(--green-dk);
  font-variant-numeric:tabular-nums}
.an .rate u i{font-style:normal;font-size:15px;color:var(--grey-lt);font-weight:700}
/* Called meter, not bar - the old name picked up the pinned tab bar's styles. */
.an .rate .meter{flex:1;height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.an .rate .meter span{display:block;height:100%;background:var(--green);border-radius:999px}
.an .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.an .cell{background:var(--paper-2);border-radius:var(--r-sm);padding:11px 13px}
.an .cell b{display:block;font-family:'Bricolage Grotesque',Archivo,sans-serif;font-weight:800;
  font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.an .cell span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--grey-lt);margin-top:4px}
.an h4{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--green-dk);margin:0 0 8px}
.an p{margin:0 0 15px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.an .note{font-size:12.5px;color:var(--grey-lt);line-height:1.55;margin:0}
.an .standing{font-size:14px;color:var(--grey);line-height:1.6;margin:0 0 15px}
.an .standing b{color:var(--ink)}
.an .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:999px;background:var(--green-lt);color:var(--green-dk);margin:0 6px 6px 0}
.an .pill.bad{background:#F3EEE6;color:#7A5A22}

/* ── news ───────────────────────────────────────────────── */
.sec{padding:20px 4px 10px}
.sec h2{font-size:20px}
.sec .lbl{color:var(--green-dk);display:block;margin-bottom:8px}
.sec p{margin:8px 0 0;font-size:14px;color:var(--grey);line-height:1.55}
.story{display:block;border-radius:var(--r);padding:16px 18px;margin-bottom:9px;
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border:1px solid #DFEBE3;box-shadow:0 3px 12px rgba(20,60,40,.07)}
.story h3{font-size:17px;font-weight:600;line-height:1.45}
.story.lead h3{font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.025em;
  font-family:'Bricolage Grotesque',Archivo,Arial,sans-serif}
.story .by{margin-top:10px;font-size:12.5px;color:var(--grey);font-weight:600}
.story .by b{color:var(--green-dk);font-weight:700}
.story .by s{text-decoration:none;color:var(--grey-lt)}
.paid .story{background:#EFF3F0;box-shadow:none}

/* ── alerts + club ──────────────────────────────────────── */
.panel{background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border-radius:var(--r);padding:20px;margin-bottom:10px;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07)}
.panel .lbl{color:var(--green-dk);display:block;margin-bottom:9px}
.panel h2{font-size:20px;margin-bottom:9px}
.panel p{margin:0 0 16px;font-size:14.5px;color:var(--grey);line-height:1.6}
.panel p b{color:var(--ink);font-weight:600}
.btn{display:block;background:var(--forest);color:#fff;text-align:center;padding:16px;
  font-size:15px;font-weight:700;border-radius:12px;margin-bottom:11px;
  border:1.5px solid #0F5C34;box-shadow:0 3px 0 #0F5C34}
.btn:active{box-shadow:0 1px 0 #0F5C34;transform:translateY(2px)}
.btn.alt{background:var(--green-lt);color:var(--green-dk);border-color:#BFDFCD;
  box-shadow:0 3px 0 #BFDFCD}
.btn.alt:active{box-shadow:0 1px 0 #BFDFCD}
.fine{font-size:13px;color:var(--grey-lt);line-height:1.6;margin:14px 0 0}
.act{display:flex;align-items:center;gap:15px;border-radius:var(--r);
  background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  padding:16px 18px;margin-bottom:9px;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07);position:relative;overflow:hidden}
.act::after{content:"";position:absolute;right:-26px;bottom:-30px;width:110px;height:110px;
  background:var(--crest) no-repeat center/contain;opacity:.045;pointer-events:none}
.act>*{position:relative;z-index:1}
.act .ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--green-lt);
  border:1px solid #CFE6D9;display:grid;place-items:center;font-size:17px;font-weight:800;
  color:var(--green-dk);font-family:'Bricolage Grotesque',Archivo,sans-serif}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-size:16.5px;font-weight:700}
.act .tx span{display:block;font-size:13.5px;color:var(--grey);margin-top:2px;line-height:1.4}
.act .go{flex:none;font-size:19px;color:var(--green)}

/* ── club sub-nav and media ─────────────────────────────── */
.mgroup{display:flex;align-items:center;gap:11px;padding:20px 2px 10px}
.mgroup .lbl{color:var(--green-dk);flex:none}
.mgroup::after{content:"";flex:1;height:1px;background:#BFDFCD}
/* One card per section with hairline rows, rather than a floating card per
   link. Far less white space and much quicker to scan. */
.mlist{background:linear-gradient(168deg,#FFFFFF 0%,#FFFFFF 55%,#F3FAF6 100%);
  border-radius:var(--r);overflow:hidden;border:1px solid #DFEBE3;
  box-shadow:0 3px 12px rgba(20,60,40,.07);position:relative}
.mlist::after{content:"";position:absolute;right:-26px;bottom:-30px;width:118px;height:118px;
  background:var(--crest) no-repeat center/contain;opacity:.045;pointer-events:none}
.mlist .mrow{position:relative;z-index:1}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 15px;
  border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .ic{width:34px;height:34px;flex:none;border-radius:10px;background:var(--green-lt);
  border:1px solid #CFE6D9;display:grid;place-items:center;font-size:13.5px;
  color:var(--green-dk)}
.mrow:active{background:rgba(35,166,90,.06)}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-size:15.5px;font-weight:700;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tx span{display:block;font-size:12.5px;color:var(--grey);margin-top:1px;
  line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

(function(){
"use strict";

var DATA;
try { DATA = JSON.parse(document.getElementById('seed').textContent); }
catch(err){

}

/* Both is the landing view - most people want the whole parish, not one branch. */
var branch = 'all', grade = 'All', homeOnly = false, view = 'fixtures';
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAY = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function d(s){ var p=s.split('-'); return new Date(+p[0], p[1]-1, +p[2]); }
function longDate(s){ var x=d(s); return DAY[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]; }
function shortDate(s){ var x=d(s); return DAY[x.getDay()].slice(0,3)+' '+x.getDate()+' '+MON[x.getMonth()]; }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function daysAway(s){ var t=new Date(); t.setHours(0,0,0,0); return Math.round((d(s)-t)/86400000); }
function br(b){ var B = DATA.branches || {}; return B[b] || B.men ||
  {name:"Men", team:'Gleann Uiseann', crest:'crest.png', source:'#'}; }
function ourName(b){ return br(b).team; }
function label(n,b){ return n===ourName(b) ? 'Killeshin' : n; }

/* A venue only counts once the county board has named one. Anything that
   starts with TBC - including the odd "TBC Referee: TBC" the board sends -
   is treated as not announced, and simply left off the card. */
function venueKnown(v){
  v = String(v || '').trim();
  return !!v && !/^tbc\b/i.test(v);
}
function venueOf(m){ return venueKnown(m.venue) ? m.venue : ''; }

/* Killeshin listed first means we are hosting, even before the county board
   fills in the ground - most ladies fixtures sit as TBC until days out. */
function atHome(m){
  var v = m.venue || '';

  return !!m.isHome && !venueKnown(v);

function flagBadge(m){
  return m.isUpdated ? '<span class="flagbadge upd">Updated</span>' : '';

function startOf(m){

  var t = /^\d{1,2}:\d{2}$/.test(m.time) ? m.time.split(':') : ['23','59'];

/* Only on away games - nobody needs directions to their own pitch. */
function directions(match){
  if(atHome(match)) return '';
  var u = mapUrl(match.venue);
  if(!u) return '';
  return '<a class="dir" href="'+u+'" target="_blank" rel="noopener">\u2192 Directions</a>';
}

function pick(list){
  return list.filter(function(m){
    if(grade === '__mine'){
      if(!isMine(m)) return false;            /* spans both branches by design */
    } else {
      if(branch !== 'all' && m.branch !== branch) return false;
      if(grade !== 'All' && m.grade !== grade) return false;
    }
    if(homeOnly && !atHome(m)) return false;
    return true;
  });
}
function mark(m){
  return mixed() ? '<span class="bm '+m.branch+'">'+(m.branch==='men'?"MEN":'LADIES')+'</span>' : '';
}

/* ---- form guide: last five for a branch and grade ---- */
function formFor(b, g){
  var list = DATA.results.filter(function(r){
    return r.branch === b && (!g || r.grade === g); });
  return list.slice(0, 5).reverse();          /* results are newest first */
}
function formStrip(b, g, label_){
  var f = formFor(b, g);
  if(f.length < 2) return '';
  return '<div class="form"><span class="lbl">'+esc(label_ || 'Form')+'</span>' +
    f.map(function(r){ return '<i class="'+r.outcome+'">'+r.outcome+'</i>'; }).join('') + '</div>';
}

/* ---- hero ---- */
var MICON = {
  cal:   '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  pin:   '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  shirt: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3l4 2 4-2 5 3-2.5 4L17 9v12H7V9l-1.5 1L3 6z"/></svg>'
};
/* Their crest if the board has one, otherwise their initials. */
function initials(name){
  var clean = String(name || '').replace(/\b(GAA|CLG|Club|Gaels|Parish)\b/gi,' ').trim();
  var words = clean.split(/\s+/).filter(Boolean);
  if(words.length === 1) return words[0].slice(0,3).toUpperCase();   /* BAL, POR */
  return words.slice(0,3).map(function(w){ return w.charAt(0).toUpperCase(); }).join('');
}
function monoHtml(name, id){
  var t = initials(name);
  return '<span class="mono' + (t.length > 2 ? ' long' : '') + '" id="' + id + '">' +
         '<span>' + esc(t) + '</span></span>';
}
function oppCrest(name, id){
  var url = (DATA.crests || {})[name];
  if(!url) return monoHtml(name, id);
  /* If the crest fails to load, fall back to the badge rather than a gap. */
  return '<span class="crest" id="'+id+'"><img src="'+esc(url)+'" alt="" ' +
    'onerror="this.parentNode.outerHTML=' +
    esc(JSON.stringify(monoHtml(name, id))).replace(/"/g,'&quot;') + '"></span>';
}

function oneBadge(html, cls){
  return '<span class="mini' + (cls ? ' ' + cls : '') + '">' + html + '</span>';
}
/* Last three results, oldest to newest. Shows fewer if fewer have been played,
   and nothing at all if the board has published none. */
function formDots(name, branch, grade, kind){
  var key = looseKey(name) + '|' + branch + '|' + grade + '|' + kind;
  var f = (DATA.form || {})[key];
  if(!f || !f.length) return '';
  return '<span class="fdots">' + f.slice(0, 3).reverse().map(function(o){
    var word = o === 'W' ? 'Won' : o === 'L' ? 'Lost' : 'Drew';
    return '<i class="' + o + '" title="' + word + '">' + o + '</i>'; }).join('') + '</span>';
}
function clubBadge(branch){
  return oneBadge('<img src="' + esc(crestOf(branch)) + '" alt="">', 'us');
}
function rivalBadge(name){
  var url = (DATA.crests || {})[name];
  var t = initials(name);
  var fallback = '<b class="' + (t.length > 2 ? 'long' : '') + '">' + esc(t) + '</b>';
  var inner = url
    ? '<img src="' + esc(url) + '" alt="" onerror="this.outerHTML=' +
      esc(JSON.stringify(fallback)).replace(/"/g,'&quot;') + '">'
    : fallback;
  return oneBadge(inner);
}

function metaCell(icon, top, sub){
  return '<div class="m">' + MICON[icon] + '<div><b>' + top + '</b>' +
         (sub ? '<span>' + sub + '</span>' : '') + '</div></div>';
}

function renderNext(){
  var hero = document.getElementById('hero');
  var pool = pick(upcoming());          /* respects branch, grade and home only */

  if(!pool.length){ hero.hidden = true; } else {
    var f = pool[0], n = daysAway(f.date);
    hero.hidden = false;
    hero.style.setProperty('--crest', 'url(' + crestOf(f.branch) + ')');

    document.getElementById('heroLbl').textContent =
      mixed() ? (f.branch==='men' ? 'Next match \u00b7 Men' : 'Next match \u00b7 Ladies')
              : 'Next match';

    var mins = Math.round((startOf(f) - Date.now()) / 60000);
    document.getElementById('heroCd').innerHTML = MICON.cal + '<span>' +
      esc(mins <= 60 ? (mins <= 1 ? 'Starting now' : 'In ' + mins + ' min')
        : n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'In ' + n + ' days') + '</span>';

    document.getElementById('heroCrest').src = crestOf(f.branch);
    document.getElementById('heroOpp').textContent = label(f.opponent, f.branch);
    document.getElementById('heroOppCrest').outerHTML = oppCrest(f.opponent, 'heroOppCrest');
    document.getElementById('heroComp').textContent = f.competition;

    var timed = /^\d{1,2}:\d{2}$/.test(f.time);
    var home = atHome(f), venue = venueOf(f);
    document.getElementById('heroMeta').innerHTML =
      metaCell('cal', esc(shortDate(f.date)), timed ? esc(f.time) : '') +
      (venue
        ? metaCell('pin', esc(venue), home ? 'At home' : 'Away')
        : metaCell('pin', home ? 'Home' : 'Away', '')) +
      metaCell('shirt', esc(f.grade), '');

    var refBox = document.getElementById('heroRef');
    if(f.referee && f.referee !== 'TBC'){
      refBox.hidden = false;
      refBox.innerHTML = MICON.shirt + '<span>Referee: ' + esc(f.referee) + '</span>';
    } else {
      refBox.hidden = true;
    }

    var mu = home ? null : mapUrl(f.venue);
    document.getElementById('heroDir').innerHTML = ticketPill(f) + (mu
      ? '<a class="dir" href="' + mu + '" target="_blank" rel="noopener">\u2192 Directions</a>'
      : '');

    weather(f, document.getElementById('heroWx'), true);
  }

  var hm = pick(upcoming()).filter(function(f){
    return atHome(f) && f !== pool[0]; })[0];
  var box = document.getElementById('athome');
  if(!hm){ box.hidden = true; return; }
  box.hidden = false;
  document.getElementById('ahCrest').src = crestOf(hm.branch);
  document.getElementById('ahLine').textContent =
    (mixed() ? (hm.branch==='men' ? 'Men ' : 'Ladies ') : '') +
    hm.grade + '  v  ' + label(hm.opponent, hm.branch);
  var bits = [shortDate(hm.date)];
  if(/^\d{1,2}:\d{2}$/.test(hm.time)) bits.push(hm.time);
  if(venueKnown(hm.venue)) bits.push(hm.venue);
  document.getElementById('ahSub').innerHTML =
    MICON.cal + '<span>' + esc(bits.join('  \u00b7  ')) + '</span>';
  weather(hm, document.getElementById('ahWx'), false);
}

/* ---- weather: Killeshin, from the free open-meteo service ---- */
var WX = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',
  80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorms',96:'Thunderstorms',
  99:'Thunderstorms'};
function weather(match, el, big){
  if(!el) return;
  var n = daysAway(match.date);
  var timed = /^\d{1,2}:\d{2}$/.test(match.time);

  if(n < 0 || !timed){ el.hidden = true; return; }
  if(n > 14){                                   /* forecasts do not reach that far */
    if(!big){ el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = '<span class="ico">\u2601</span><span class="soft">' +
      'Forecast appears about two weeks out.</span>';
    return;
  }

  el.hidden = false;
  el.innerHTML = big
    ? '<span class="ico">\u2601</span><span class="soft">Checking the forecast\u2026</span>'
    : '<span class="soft">Checking the forecast\u2026</span>';

  var when = match.date + 'T' + (match.time.length === 4 ? '0' : '') + match.time;
  var want = when.slice(0, 13) + ':00';

  fetch('https://api.open-meteo.com/v1/forecast?latitude=52.85&longitude=-7.02' +
        '&hourly=temperature_2m,precipitation_probability,weather_code' +
        '&timezone=Europe%2FDublin&forecast_days=16')
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      var i = j.hourly.time.indexOf(want);
      if(i < 0) throw 0;
      var t = Math.round(j.hourly.temperature_2m[i]);
      var rain = j.hourly.precipitation_probability[i];
      var sky = WX[j.hourly.weather_code[i]] || 'Forecast';
      var line = sky + ' \u00b7 ' + t + '\u00b0C \u00b7 ' + rain + '% chance of rain';
      if(big){
        el.innerHTML = '<span class="ico">' + icon(j.hourly.weather_code[i]) + '</span>' +
          '<span><b>At throw-in</b><span class="soft">' + esc(line) + '</span></span>';
      } else {
        el.textContent = icon(j.hourly.weather_code[i]) + '  ' + line;
      }
    })
    .catch(function(){
      /* No forecast is better than a wrong one - say so rather than guess. */
      if(big){ el.innerHTML = '<span class="ico">\u2601</span>' +
        '<span class="soft">Forecast not available right now.</span>'; }
      else { el.hidden = true; }
    });
}
function icon(code){
  if(code === 0 || code === 1) return '\u2600';
  if(code === 2) return '\u26C5';
  if(code === 3 || code === 45 || code === 48) return '\u2601';
  if(code >= 71 && code <= 77) return '\u2744';
  if(code >= 95) return '\u26C8';
  if(code >= 51) return '\u2614';
  return '\u2601';
}

/* ---- fixtures ---- */
/* One line per team: crest, full name (allowed to wrap), recent form. */
function fxTeam(m, name){
  var mine = name === ourName(m.branch);
  return '<div class="fx-team' + (mine ? ' us' : '') + '">' +
    (mine ? clubBadge(m.branch) : rivalBadge(name)) +
    '<span class="fx-name">' + esc(label(name, m.branch)) + '</span>' +
    formDots(name, m.branch, m.grade, compKind(m.competition)) + '</div>';
}
function renderFixtures(){
  var list = pick(upcoming());

  /* The next match already has the panel above, so leave it out of the list
     rather than showing the same game twice. */
  var hero = document.getElementById('hero');
  var shown = hero && !hero.hidden && view === 'fixtures';
  var only = shown && list.length === 1;
  if(shown && list.length) list = list.slice(1);

  if(!list.length){
    return only
      ? '<div class="empty"><img src="' + crestOf(branch==='ladies'?'ladies':'men') + '" alt="">' +
        '<b>That is the lot for now</b><span>The game above is the only one down. ' +
        'New fixtures appear within an hour of the county board publishing them.</span></div>'
      : empty('Nothing down yet', emptyWhy('fixtures'));
  }
  var html='', day=null;
  list.forEach(function(f){
    if(f.date!==day){
      day=f.date; var n=daysAway(f.date);
      html += '<div class="dayhead'+(n<=2?' soon':'')+'">' + esc(longDate(f.date)) +
              (n===0?' \u2014 today':n===1?' \u2014 tomorrow':'') + '</div>';
    }
    var timed = /^\d{1,2}:\d{2}$/.test(f.time);
    var home = atHome(f), venue = venueOf(f);
    var ref = (f.referee && f.referee !== 'TBC') ? f.referee : '';
    var acts = ticketPill(f) + directions(f);
    /* Drawn first but played at a county ground (semi-finals, finals):
       neither home nor away, so say so. */
    var ha = home ? ['h','Home'] : f.isHome ? ['n','Neutral'] : ['a','Away'];
    html += '<div class="card fx' + (home ? ' hm' : '') + (f.branch === 'ladies' ? ' lad' : '') + '">' +
      '<div class="fx-top">' +
        '<span class="fx-tags">' + '<span class="fx-grade">' + esc(f.grade) + '</span>' +
          flagBadge(f) + mark(f) +
          '<span class="fx-ha ' + ha[0] + '">' + ha[1] + '</span>' +
        '</span>' +
        (timed ? '<span class="fx-time num">' + esc(f.time) + '</span>' : '') +
      '</div>' +
      '<div class="fx-teams">' + fxTeam(f, f.home) + fxTeam(f, f.away) + '</div>' +
      '<div class="fx-comp">' + esc(f.competition) + '</div>' +
      (venue ? '<div class="fx-line">' + MICON.pin + '<span>' + esc(venue) + '</span></div>' : '') +
      (ref ? '<div class="fx-line ref">' + MICON.shirt + '<span>Referee: ' + esc(ref) + '</span></div>' : '') +
      (acts ? '<div class="fx-act">' + acts + '</div>' : '') +
    '</div>';
  });
  return html;
}

  var list = pick(DATA.results);
  if(!list.length) return empty('No results yet', emptyWhy('results'));
  var html = '';
  if(branch !== 'all'){
    var f = formStrip(branch, grade === 'All' ? null : grade, 'Last 5');

        '<span class="obadge '+r.outcome+'">'+word+'</span>' +

      scoreLine(r, r.home, r.homeScore, r.homeTotal, r.homeTotal>r.awayTotal) +

}

  }).join('');
}

/* ---- record: wins by age group, adult down to U12 ---- */
function normComp(x){ return String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

function tally(b){
  var by = {}, tabs = [];
  function bucket(g){
    return by[g] || (by[g] = {p:0,W:0,D:0,L:0,f:0,a:0}); }

  DATA.tables.forEach(function(t){
    if(t.branch !== b) return;
    var us = ourName(b);
    var row = null;
    for(var i=0;i<t.rows.length;i++) if(t.rows[i].team === us) row = t.rows[i];
    if(!row || !row.p) return;
    tabs.push(normComp(t.competition));
    var g = bucket(t.grade);
    g.p += row.p; g.W += row.w; g.D += row.d; g.L += row.l;
    g.f += row.f; g.a += row.a;
  });

  /* Knockout rounds sit outside the tables, so add them from the results. */
  DATA.results.forEach(function(r){
    if(r.branch !== b) return;
    var rn = normComp(r.competition);
    for(var i=0;i<tabs.length;i++){
      if(rn.indexOf(tabs[i]) === 0 || tabs[i].indexOf(rn) === 0) return;
    }
    var g = bucket(r.grade);
    g.p++; g[r.outcome]++;
    g.f += r.ourTotal || 0; g.a += r.theirTotal || 0;
  });
  return by;
}

function branchRecord(b){
  var by = tally(b), order = (DATA.gradesBy || {})[b] || [];
  var have = order.filter(function(g){ return by[g]; });
  Object.keys(by).forEach(function(g){ if(have.indexOf(g) === -1) have.push(g); });
  if(!have.length) return '';

  var t = {p:0,W:0,D:0,L:0,f:0,a:0};
  have.forEach(function(g){
    ['p','W','D','L','f','a'].forEach(function(k){ t[k] += by[g][k]; }); });
  var pct = t.p ? Math.round(t.W / t.p * 100) : 0;

  var head = mixed()
    ? '<div class="bhead"><img src="'+esc(crestOf(b))+'" alt=""><b>' +
      esc(br(b).name) + '</b></div>'
    : '';

  var board = '<section class="sb"><span class="lbl">Season so far</span>' +
    '<div class="big">' +
      '<div class="wins"><u>'+t.W+'</u><span>Won</span></div>' +
      '<div><u>'+t.D+'</u><span>Drawn</span></div>' +
      '<div><u>'+t.L+'</u><span>Lost</span></div>' +
    '</div>' +
    '<div class="tot"><b>'+t.p+'</b> games \u00b7 <b>'+pct+'%</b> won \u00b7 ' +
    '<b>'+t.f+'</b> points scored, <b>'+t.a+'</b> conceded' +
    '<br><span style="opacity:.7;font-size:12.5px">Counted from the county board league tables' +
    ', plus knockout rounds.</span></div></section>';

  var rows = have.map(function(g){
    var r = by[g], gp = r.p ? Math.round(r.W / r.p * 100) : 0;
    var key = b + '|' + g, open = OPEN[key];
    return '<div class="gr'+(r.W===0?' none':'')+'" data-key="'+esc(key)+'" ' +
      'role="button" tabindex="0" aria-expanded="'+(open?'true':'false')+'">' +
      '<div class="nm"><b>'+esc(g)+'</b>' +
      '<span>'+r.p+' played \u00b7 '+r.W+'W '+r.D+'D '+r.L+'L \u00b7 '+gp+'% \u00b7 ' +
      r.f+'\u2013'+r.a+'</span></div>' +
      '<div class="w"><u>'+r.W+'</u><span>Wins</span></div>' +
      '<span class="go">' + (open ? 'Close' : 'Stats') + '<em>\u203A</em></span></div>' +
      (open ? analyse(b, g) : '');
  }).join('');

  return head + board + rows;
}

/* Several competitions are championships played in a league format
   ("U17 B Championship - League Division 1"), so the word championship wins. */
function compKind(name){
  return String(name || '').toLowerCase().indexOf('championship') > -1
    ? 'championship' : 'league';
}

function statsFor(b, g, kind){
  var us = ourName(b);
  var out = {p:0,W:0,D:0,L:0,f:0,a:0,places:[],games:[]}, covered = [];

  DATA.tables.forEach(function(t){
    if(t.branch !== b || t.grade !== g || compKind(t.competition) !== kind) return;
    for(var i=0;i<t.rows.length;i++){
      var r = t.rows[i];
      if(r.team !== us || !r.p) continue;
      covered.push(normComp(t.competition));
      out.p += r.p; out.W += r.w; out.D += r.d; out.L += r.l;
      out.f += r.f; out.a += r.a;
      out.places.push({comp:t.competition, pos:i+1, of:t.rows.length, pts:r.pts});
    }
  });

  DATA.results.forEach(function(r){
    if(r.branch !== b || r.grade !== g || compKind(r.competition) !== kind) return;
    out.games.push(r);
    var rn = normComp(r.competition);
    for(var i=0;i<covered.length;i++){
      if(rn.indexOf(covered[i]) === 0 || covered[i].indexOf(rn) === 0) return;
    }
    out.p++; out[r.outcome]++;
    out.f += r.ourTotal || 0; out.a += r.theirTotal || 0;
  });

  out.games.sort(function(x,y){ return x.date < y.date ? 1 : -1; });
  return out;
}

/* ---- compared to whoever is next up in this exact competition ---- */
function tableRowIn(b, g, kind, team){
  var row = null;
  DATA.tables.forEach(function(t){
    if(t.branch !== b || t.grade !== g || compKind(t.competition) !== kind) return;
    t.rows.forEach(function(r){ if(r.team === team) row = r; });
  });
  return row;
}
function nextOpponentIn(b, g, kind){
  var next = upcoming().filter(function(f){
    return f.branch === b && f.grade === g && compKind(f.competition) === kind;
  }).sort(function(x,y){ return x.date < y.date ? -1 : (x.date > y.date ? 1 : 0); })[0];
  return next ? next.opponent : null;
}
function opponentCompare(b, g, kind){
  var opp = nextOpponentIn(b, g, kind);
  if(!opp) return '';
  var us = tableRowIn(b, g, kind, ourName(b));
  var them = tableRowIn(b, g, kind, opp);
  if(!us || !them || !us.p || !them.p) return '';   /* need a real season from both sides */

  return '<h4>Compared to ' + esc(label(opp, b)) + '</h4>' +
    '<div class="h2h" style="margin-top:0;padding-top:0;border-top:0">' +
    '<table><thead><tr><th class="t">Team</th><th>P</th><th>Scored</th><th>Conceded</th></tr></thead>' +
    '<tbody><tr class="us"><td class="t">Killeshin</td><td>'+us.p+'</td><td>'+us.f+'</td><td>'+us.a+'</td></tr>' +
    '<tr><td class="t">'+esc(label(opp,b))+'</td><td>'+them.p+'</td><td>'+them.f+'</td><td>'+them.a+'</td></tr>' +
    '</tbody></table></div>';
}

function analyse(b, g){
  var key = b + '|' + g;
  var kinds = [];
  ['championship','league'].forEach(function(k){
    var st = statsFor(b, g, k);
    if(st.p > 0 || st.games.length) kinds.push({k:k, st:st});
  });
  if(!kinds.length) return '';

  /* Default to whichever the team has played most of. */
  var pick = SUBTAB[key];
  if(!pick || !kinds.some(function(x){ return x.k === pick; })){
    pick = kinds.slice().sort(function(x,y){ return y.st.p - x.st.p; })[0].k;
  }
  var cur = kinds.filter(function(x){ return x.k === pick; })[0].st;

  var tabs = kinds.length > 1
    ? '<div class="ktabs">' + kinds.map(function(x){
        return '<button data-k="'+esc(key)+'" data-kind="'+x.k+'" aria-pressed="' +
          (x.k === pick) + '">' + (x.k === 'league' ? 'League' : 'Championship') +
          '</button>'; }).join('') + '</div>'
    : '<div class="konly">' + (pick === 'league' ? 'League only' : 'Championship only') +
      ' \u2014 no ' + (pick === 'league' ? 'championship' : 'league') +
      ' for this age group</div>';

  return '<div class="an">' + tabs + panelFor(b, g, pick, cur) + '</div>';
}

function panelFor(b, g, kind, t){
  var played = t.p || t.games.length;
  if(!played) return '<p class="note">Nothing played yet.</p>';

  var winPct = Math.round((t.W + 0.5*t.D) / played * 100);
  var per = (t.f - t.a) / played;
  var scored = t.f / played, letIn = t.a / played;

  var winScore = (t.W + 0.5*t.D) / played * 10;
  var margScore = Math.max(0, Math.min(10, 5 + per/3));
  var posScore = t.places.length
    ? t.places.reduce(function(a,p){ return a + (p.of-p.pos)/(p.of-1); }, 0) / t.places.length * 10
    : winScore;
  var rating = Math.round((0.45*winScore + 0.35*margScore + 0.20*posScore) * 10) / 10;

  /* form: oldest on the left, newest on the right */
  var last = t.games.slice(0, 5).reverse();
  var form = last.length
    ? '<div class="form"><span class="lbl">Last ' + last.length + '</span>' +
      last.map(function(r){
        return '<i class="'+r.outcome+'" title="'+esc(label(r.opponent, r.branch))+'">' +
               r.outcome + '</i>'; }).join('') + '</div>'
    : '';

  var home = t.games.filter(function(r){ return atHome(r); });
  var away = t.games.filter(function(r){ return !atHome(r); });
  function wl(l){ return l.filter(function(r){return r.outcome==='W';}).length + 'W-' +
                         l.filter(function(r){return r.outcome==='L';}).length + 'L'; }
  var best=null, worst=null;
  t.games.forEach(function(r){
    var m = r.ourTotal - r.theirTotal;
    if(!best || m > best.ourTotal - best.theirTotal) best = r;
    if(!worst || m < worst.ourTotal - worst.theirTotal) worst = r;
  });

  var v = [];
  v.push(rating >= 7 ? 'A strong ' + kind + ' campaign.'
       : rating >= 5.5 ? 'Winning more than losing in the ' + kind + '.'
       : rating >= 4   ? 'Competitive without pulling away.'
       : 'Hard going in the ' + kind + '.');
  if(per >= 8) v.push('Winning comfortably \u2014 ' + Math.round(scored) + ' points a game to ' +
      Math.round(letIn) + '.');
  else if(per <= -8) v.push('Defeats have been heavy, conceding ' + Math.round(letIn) +
      ' a game against ' + Math.round(scored) + ' scored.');
  else if(Math.abs(per) < 3) v.push('Tight games either way, an average margin of ' +
      (per>=0?'+':'') + per.toFixed(1) + '.');
  else if(per > 0) v.push('Winning by a working margin, ' + scored.toFixed(1) + ' to ' + letIn.toFixed(1) + '.');
  else v.push('Losing narrowly more often than heavily \u2014 ' + scored.toFixed(1) +
      ' to ' + letIn.toFixed(1) + ', so the gap is closeable.');

  if(home.length >= 2 && away.length >= 2){
    var hw = home.filter(function(r){return r.outcome==='W';}).length/home.length;
    var aw = away.filter(function(r){return r.outcome==='W';}).length/away.length;
    if(hw - aw >= 0.34) v.push('Better at home (' + wl(home) + ') than away (' + wl(away) + ').');
    else if(aw - hw >= 0.34) v.push('Travelling well \u2014 ' + wl(away) + ' away, ' + wl(home) + ' at home.');
  }
  if(played < 4) v.push('Only ' + played + ' games, so treat this lightly.');

  var standing = t.places.map(function(p){
    return '<span class="pill' + (p.pos <= Math.ceil(p.of/2) ? '' : ' bad') + '">' +
      esc(p.comp) + ' \u2014 ' + p.pos + ordinal(p.pos) + ' of ' + p.of + '</span>';
  }).join('');

  return '<div class="rate"><u>' + rating.toFixed(1) + '<i>/10</i></u>' +
      '<span class="meter"><span style="width:' + (rating*10) + '%"></span></span></div>' +
    (form ? form + '<div style="height:14px"></div>' : '') +
    '<div class="grid">' +
      cell(t.W + '<span style="font-size:14px;color:var(--grey-lt)">/' + played + '</span>', 'Won') +
      cell(winPct + '%', 'Win rate') +
      cell((per>=0?'+':'') + per.toFixed(1), 'Margin a game') +
      cell(scored.toFixed(1) + '<span style="font-size:14px;color:var(--grey-lt)">\u2013' +
           letIn.toFixed(1) + '</span>', 'Scored / let in') +
    '</div>' +
    (standing ? '<h4>Where they stand</h4><p class="standing">' + standing + '</p>' : '') +
    opponentCompare(b, g, kind) +
    '<h4>The season in short</h4><p>' + v.join(' ') + '</p>' +
    (best && worst && t.games.length >= 2 ?
      '<h4>Best and worst</h4><p class="standing">' +
      '<b>Biggest win</b> \u2014 ' + esc(scoreText(best)) + '<br>' +
      '<b>Heaviest defeat</b> \u2014 ' + esc(scoreText(worst)) + '</p>' : '') +
    '<p class="note">Played, won and lost come from the county board tables. ' +
    'Form and margins use the ' + t.games.length + ' matches published in full.</p>';
}

function cell(a,b){ return '<div class="cell"><b>'+a+'</b><span>'+b+'</span></div>'; }
function ordinal(n){
  return n===1?'st':n===2?'nd':n===3?'rd':'th'; }
function scoreText(r){
  return label(r.opponent, r.branch) + ' ' + (r.isHome ? '(h)' : '(a)') + ' ' +
    (r.isHome ? r.homeScore + ' v ' + r.awayScore : r.awayScore + ' v ' + r.homeScore) +
    '  \u00b7  ' + shortDate(r.date);
}

function renderMedia(){
  var media = (DATA.club && DATA.club.media) || [];
  var facts = (DATA.club && DATA.club.facts) || null;
  if(!media.length && !facts) return empty('Nothing here yet', 'Media links can be added to the data block.');

  var mark = {video:'\u25B6', read:'\u2630', social:'\u25C9', about:'\u2691'};
  function row(icon, title, note, url, wrap){
    return '<a class="mrow' + (wrap ? ' wrap2' : '') + '" href="' + esc(url) +
      '" target="_blank" rel="noopener"><span class="ic">' + icon + '</span>' +
      '<span class="tx"><b>' + esc(title) + '</b><span>' + esc(note) + '</span></span>' +
      '<span class="go">\u2192</span></a>';
  }
  function block(label, rows){
    return rows ? '<div class="mgroup"><span class="lbl">' + esc(label) + '</span></div>' +
                  '<div class="mlist">' + rows + '</div>' : '';
  }

  var html = '';

  var news = (DATA.news || []).slice(0, 6);
  if(news.length){
    html += block('Latest', news.map(function(n){
      var age = -daysAway(n.date), when = shortDate(n.date);
      if(age === 0) when = 'Today'; else if(age === 1) when = 'Yesterday';
      else if(age > 1 && age < 7) when = age + ' days ago';
      return row('\u2630', n.title, n.source + ' \u00b7 ' + when +
        (n.access === 'subscriber' ? ' \u00b7 subscribers' : ''), n.url, true);
    }).join(''));
  }

  [['video','Watch'],['read','Read'],['social','Follow'],['about','History']].forEach(function(g){
    var items = media.filter(function(m){ return m.kind === g[0]; });
    if(!items.length) return;
    html += block(g[1], items.map(function(m){
      return row(mark[m.kind], m.title, m.note, m.url);
    }).join(''));
  });

  if(facts){
    html += '<div class="mgroup"><span class="lbl">About the club</span></div>' +
      '<div class="clubfacts"><dl>' +
      (facts.founded ? '<dt>Founded</dt><dd>'+esc(facts.founded)+'</dd>' : '') +
      (facts.ground  ? '<dt>Ground</dt><dd>'+esc(facts.ground)+'</dd>' : '') +
      (facts.colours ? '<dt>Colours</dt><dd>'+esc(facts.colours)+'</dd>' : '') +
      '</dl>' +
      (facts.honours && facts.honours.length
        ? '<h4>Roll of honour</h4><ul>' +
          facts.honours.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('') + '</ul>'
        : '') + '</div>';
  }
  return html;
}

/* Switching tab puts you at the top of the new list. Expanding a row or a
   background refresh must not move the page at all. */
function draw(scroll){
  var out = document.getElementById('out');
  try { drawInner(); filters(); }
  catch(err){
    console.error(err);
    out.innerHTML = empty('Something went wrong', 'Pull down to refresh.');
  }
  homePanels();
  if(scroll !== false){
    window.scrollTo(0, 0);
    /* restart the animation: strip the class, force a reflow, put it back */
    out.classList.remove('swap');
    void out.offsetWidth;
    out.classList.add('swap');
  }
}

  if(grade !== 'All' && grade !== '__mine' && grades().indexOf(grade) === -1) grade = 'All';
  savePrefs();
  showBranch();
  renderNext(); draw(false); homePanels();
});
document.getElementById('out').addEventListener('click', function(e){
  if(e.target.closest('#clearFilter')){
    branch = 'all'; grade = 'All'; homeOnly = false;
    savePrefs(); showBranch(); renderNext(); draw(false);
    return;
  }
  var ft = e.target.closest('.feat');
  if(ft){ var fk = ft.dataset.feat; OPENFEAT[fk] = !OPENFEAT[fk]; count('/club/'+fk); draw(false); return; }
  var kt = e.target.closest('.ktabs button');
  if(kt){ SUBTAB[kt.dataset.k] = kt.dataset.kind; draw(false); return; }
  var row = e.target.closest('.gr'); if(!row) return;
  var k = row.dataset.key;
  OPEN[k] = !OPEN[k];
  count('/record/' + k.replace('|', '/'));
  draw(false);
});
document.getElementById('picker').addEventListener('click', function(e){
  var b = e.target.closest('.pick');
  if(b){
    var id = b.dataset.team, i = MINE.indexOf(id);
    if(i > -1) MINE.splice(i, 1); else MINE.push(id);
    saveMine(); renderPicker();
    return;
  }
  if(e.target.closest('#pickClear')){ MINE = []; saveMine(); renderPicker(); return; }
  if(e.target.closest('#pickDone') || !e.target.closest('.panel')){
    openPicker(false);
    grade = MINE.length ? '__mine' : 'All';
    savePrefs(); renderNext(); draw(false);
  }
});

document.getElementById('ticketSheet').addEventListener('click', function(e){
  if(!e.target.closest('.panel')) openTicketSheet(false);
});

document.getElementById('filters').addEventListener('click', function(e){
  if(e.target.closest('#ticketBtn')){ openTicketSheet(true); return; }
  if(e.target.closest('#mineBtn')){
    if(MINE.length){ grade = '__mine'; savePrefs(); renderNext(); draw(false); }
    else openPicker(true);
    count('/myteams');
    return;
  }
  if(e.target.closest('#mineEdit')){ openPicker(true); return; }
  if(e.target.closest('#mineOff')){
    grade = 'All'; savePrefs(); renderNext(); draw(false); return;
  }
  if(e.target.closest('#clearFilter')){
    branch = 'all'; grade = 'All'; homeOnly = false;
    savePrefs(); showBranch(); renderNext(); draw(false);
    return;
  }
  var c = e.target.closest('.chip');
  if(c){
    var g = c.dataset.g;
    grade = (g !== 'All' && grade === g) ? 'All' : g;   /* tap a team again to clear */
    savePrefs(); renderNext(); draw(false); return;
  }
  if(e.target.closest('#homeT')){ homeOnly = !homeOnly; savePrefs(); renderNext(); draw(false); }
});
var MORE = ['media','alerts','club'];
function markTabs(){
  document.querySelectorAll('#bar button').forEach(function(b){
    var v = b.dataset.view;
    b.setAttribute('aria-selected',
      String(v ? v === view : MORE.indexOf(view) > -1));   /* More lights up too */
  });
  document.querySelectorAll('#sheet button').forEach(function(b){
    b.setAttribute('aria-selected', String(b.dataset.view === view)); });
}
function openSheet(on){
  document.getElementById('sheet').classList[on ? 'add' : 'remove']('open');
}
function go(v){
  view = v; count('/' + v); markTabs(); openSheet(false); draw();
}
document.getElementById('bar').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.id === 'moreBtn'){ openSheet(true); return; }
  go(b.dataset.view);
});
document.getElementById('sheet').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(b && b.dataset.view){ go(b.dataset.view); return; }
  if(!e.target.closest('.panel')) openSheet(false);   /* tap outside to dismiss */
});
function promo(){
  var el = document.getElementById('promo');
  var p = DATA.promo;
  if(!p || !p.show || !p.url){ el.hidden = true; return; }
  el.hidden = false;
  el.href = p.url;
  document.getElementById('promoTag').textContent = p.tag || '';
  document.getElementById('promoTitle').textContent = p.title || '';
  document.getElementById('promoNote').textContent = p.note || '';
}

function stamp(){
  var u = new Date(DATA.updated);
  var same = u.toDateString() === new Date().toDateString();
  document.getElementById('stamp').textContent = 'Updated ' +
    (same ? 'today at ' + u.toTimeString().slice(0,5) : shortDate(DATA.updated.slice(0,10)));
}

/* Tell GoatCounter which tab was opened. Silent if the script is blocked. */
function count(path){
  try {
    if(window.goatcounter && window.goatcounter.count){
      window.goatcounter.count({path: path, event: false});
    }
  } catch(err){ /* stats must never break the app */ }
}

/* Crests and form live in their own files so an index.html upload cannot
   wipe them. */
function looseKey(n){
  return String(n || '').toLowerCase()
    .replace(/\b(gaa|clg|club|lgfa|ladies)\b/g, ' ')
    .replace(/[^a-z0-9]/g, '');
}
/* Crest lookups are matched to club names in the fixtures and results. Kept
   so the match can be run again whenever data.json lands, whichever file
   arrives first. */
var LOOSE_CRESTS = null;
function mergeCrests(){
  if(!LOOSE_CRESTS) return;
  var merged = {}, k;
  for(k in (DATA.crests || {})) merged[k] = DATA.crests[k];
  (DATA.fixtures || []).concat(DATA.results || []).forEach(function(m){
    [m.home, m.away, m.opponent].forEach(function(n){
      if(n && !merged[n] && LOOSE_CRESTS[looseKey(n)]) merged[n] = LOOSE_CRESTS[looseKey(n)];
    });
  });
  DATA.crests = merged;
}

/* The live data lives in data.json. The copy inside this page is only a
   fallback for the first paint and for anyone opening it offline. */
function loadData(){
  fetch('data.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if(!j || !j.fixtures || !j.results || !j.branches || !j.gradesBy) return;
      var keep = {crests: DATA.crests, form: DATA.form};
      DATA = j;
      if(keep.crests) DATA.crests = keep.crests;
      if(keep.form && Object.keys(keep.form).length) DATA.form = keep.form;
      mergeCrests();
      if(grade !== 'All' && grade !== '__mine' && grades().indexOf(grade) === -1) grade = 'All';
      renderNext(); draw(false);
      try { promo(); } catch(err){ /* leave it */ }
      try { stamp(); } catch(err){ /* leave the footer as it was */ }
    })
    .catch(function(){ /* the built-in copy stands in */ });
}

function loadCrests(){
  fetch('crests.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if(!j || typeof j !== 'object') return;
      LOOSE_CRESTS = {};
      for(var k in j) LOOSE_CRESTS[looseKey(k)] = j[k];
      mergeCrests();
      renderNext(); draw(false);
    })
    .catch(function(){ /* initials will stand in */ });
}
function loadForm(){
  fetch('form.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){
      if(!j || typeof j !== 'object') return;
      DATA.form = j;
      renderNext(); draw(false);
    })
    .catch(function(){ /* no form markers, no harm */ });
}

function counter(){
  var el = document.getElementById('count');
  if(!el) return;

  function show(n){
    var clean = String(n).replace(/[^0-9]/g, '');
    if(!clean) return false;
    var v = Number(clean);
    el.hidden = false;
    el.textContent = '\u25C9 ' + v.toLocaleString() + (v === 1 ? ' visit' : ' visits');
    return true;
  }

  var tries = [
    { url: 'https://killeshin.goatcounter.com/counter/TOTAL.json',
      read: function(j){ return j && j.count; } },
    { url: 'https://api.counterapi.dev/v1/killeshingaa/app/up',
      read: function(j){ return j && (j.count != null ? j.count : j.value); } }
  ];

  function attempt(i){
    if(i >= tries.length) return;              /* stay hidden rather than show nothing */
    fetch(tries[i].url, {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ if(!show(tries[i].read(j))) throw 0; })
      .catch(function(){ attempt(i + 1); });
  }
  attempt(0);
  setInterval(function(){ attempt(0); }, 60000);
}

function showBranch(){
  document.querySelectorAll('.br').forEach(function(x){
    x.setAttribute('aria-pressed', String(x.dataset.b === branch)); });
  var b = branch === 'ladies' ? 'ladies' : 'men';
  var c = document.getElementById('mastCrest'); if(c) c.src = crestOf(b);
  var sub = document.getElementById('mastSub');
  if(sub) sub.textContent =
    branch === 'men' ? 'CLG Gleann Uise\u00e1n' :
    branch === 'ladies' ? 'Killeshin Ladies' : 'F\u00e1ilte go Gleann Uise\u00e1n';
}

function boot(first){
  try { renderNext(); } catch(err){ console.error(err);
    document.getElementById('hero').hidden = true;
    document.getElementById('athome').hidden = true; }
  try { showBranch(); } catch(err){ console.error(err); }
  draw(first !== true);
  try { markTabs(); } catch(err){ console.error(err); }
  try { promo(); } catch(err){ console.error(err); }
  try { stamp(); } catch(err){ console.error(err); }
}
loadMine();
loadPrefs();
boot(true);
counter();
loadData();
loadCrests();
loadForm();

/* Tick every half minute: refreshes the countdown, and rolls straight on to
   the following game the moment throw-in passes - no reload needed. */
setInterval(function(){
  try { renderNext(); if(view === 'fixtures') draw(false); } catch(err){ console.error(err); }
}, 30000);
})();
</script>
