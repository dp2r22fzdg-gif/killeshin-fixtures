<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11492E">
<title>Scorer | Killeshin GAA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#11492E;--deep2:#1D5C3C;--forest:#1F824A;--accent:#3ACD77;--ink:#fff;--mute:rgba(255,255,255,.62);--line:rgba(255,255,255,.14);--them:#26352D;--warn:#F2B544;--bad:#FF7A6B;--red:#E5484D;
  --sans:'Barlow',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--num:'Barlow Condensed','Arial Narrow',-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--deep);color:var(--ink);font:16px/1.4 var(--sans);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#app{max-width:520px;margin:0 auto;padding:12px 16px 24px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:8px}
.top h1{font-size:20px;margin:0;font-weight:700}
.link{color:var(--accent);font-weight:600;padding:10px 0}
.sync{font-size:13px;color:var(--mute)}.sync.wait{color:var(--warn);font-weight:600}.sync.bad{color:var(--bad);font-weight:600}
label{display:block;font-size:14px;color:var(--mute);margin:16px 0 6px}
label small{font-size:13px;opacity:.8}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--deep2);font-size:17px}
input::placeholder{color:rgba(255,255,255,.35)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:14px;font-weight:600}.seg button.on{background:var(--accent);color:#0B2B1A}
.primary{display:block;width:100%;margin-top:22px;padding:17px;border-radius:12px;background:var(--accent);color:#0B2B1A;font-weight:700;font-size:18px}
.primary:disabled{opacity:.5}
.err{color:var(--bad);margin-top:12px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px 0;border-top:1px solid var(--line);text-align:left}
.row:last-of-type{border-bottom:1px solid var(--line)}
.row .t{font-weight:700;font-size:17px}.row .c{font-size:13px;color:var(--mute)}
.row .s{font:800 24px var(--num);font-variant-numeric:tabular-nums}
.tag{color:var(--warn);font-weight:600}
.empty{color:var(--mute);padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta{font-size:14px;color:var(--mute);margin-bottom:10px}
.webstate{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px}
.webstate i{width:9px;height:9px;border-radius:50%;flex:none}
.webstate.on{color:var(--accent)}.webstate.on i{background:var(--red);animation:pulse 1.4s infinite}
.webstate.off{color:var(--warn)}.webstate.off i{background:var(--warn)}
@keyframes pulse{50%{opacity:.25}}
.golive{display:block;width:100%;margin:0 0 14px;padding:18px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:19px}
.golive span{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:3px}
/* Match delayed: shown on the website banner while switched on */
.delay{display:block;width:100%;margin:0 0 14px;padding:14px;border-radius:12px;border:1.5px solid var(--warn);color:var(--warn);font-weight:700;font-size:16px}
.delay span{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:3px}
.delay.on{background:var(--warn);color:#2B1D00}
.board{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.side{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 0}
.side .n{font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side.them .n{font-weight:600;color:var(--mute)}
.side .sc{font:800 64px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
.side .sc small{font:600 22px var(--num);color:var(--mute);margin-left:6px}
.clock{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:10px 0 4px}
.clock .big{font:800 40px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .big.ht{color:var(--warn)}.clock .big.idle{color:var(--mute);font-size:28px}
.clock b{color:var(--accent)}.clock b.ht{color:var(--warn)}.clock b.idle{color:var(--mute)}
.note{font-size:13px;color:var(--mute);margin:2px 0 0}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.pad h2{grid-column:1/-1;font-size:14px;font-weight:600;color:var(--mute);margin:8px 0 -2px}
.hit{padding:22px 4px;border-radius:14px;font:800 26px/1 var(--num);letter-spacing:.01em}
.hit span{display:block;font:600 13px var(--sans);opacity:.75;margin-top:6px;letter-spacing:0}
.hit.us{background:var(--forest)}.hit.them{background:var(--them);border:1px solid var(--line)}
.hit:active{transform:scale(.97)}
.hit:disabled{opacity:.35}
.undo{display:block;width:100%;margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--line);font-weight:600}
.undo:disabled{opacity:.35}
.stage{display:block;width:100%;margin-top:12px;padding:17px;border-radius:12px;background:#fff;color:var(--deep);font-weight:700;font-size:18px}
.stage.end{background:var(--warn);color:#2B1D00}
.stage.et{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5)}
/* Stage buttons need a press and hold, so a stray tap never changes the half. */
.stage{position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage .fill{position:absolute;inset:0;background:rgba(0,0,0,.2);transform:scaleX(0);transform-origin:left;pointer-events:none}
.stage.et .fill{background:rgba(255,255,255,.22)}
.stage.holding .fill{transform:scaleX(1);transition:transform .8s linear}
.stage .lbl{position:relative;pointer-events:none}
.stage .lbl small{display:block;font-size:12px;font-weight:600;opacity:.7;margin-top:2px}
#holdhint.warn{color:var(--warn);font-weight:600}
#compchips{margin-top:10px}
#compchips button{font-size:14px;padding:9px 12px;text-align:left}
.quiet{display:block;margin:22px auto 0;color:var(--mute);font-size:14px;padding:10px;text-decoration:underline}
.quiet + .quiet{margin-top:4px}
.flash{animation:fl .5s}
@keyframes fl{from{color:var(--accent)}}

/* ---------- scorers ---------- */
.scorers{font-size:14px;color:var(--mute);line-height:1.5;padding:6px 0 2px}
.scorers b{color:#fff;font:800 17px var(--num);font-variant-numeric:tabular-nums;margin-left:3px}
.slist h2{font-size:14px;font-weight:600;color:var(--mute);margin:22px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.slist h2 button{color:var(--accent);font-weight:600;font-size:14px;padding:6px 0}
.sr{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 2px;border-top:1px solid var(--line);text-align:left}
.sr:last-child{border-bottom:1px solid var(--line)}
.sr .k{font-weight:700}.sr .k small{font-weight:600;color:var(--mute);font-size:13px;margin-left:8px}
.sr .who{font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--deep2);border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow-y:auto;
  box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.sheet h3{margin:0;font-size:21px;font-weight:700}
.pl{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-top:8px;padding:15px 14px;
  border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;font-size:18px;text-align:left}
.pl.hot{background:var(--forest);border-color:var(--accent)}
.pl.sel{outline:3px solid #fff;outline-offset:-3px}
.pl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl em{flex:none;font-style:normal;font:600 14px var(--sans);color:var(--mute)}
.pl.hot em{color:#fff;font:800 20px var(--num)}
.pl:active{transform:scale(.98)}
/* Players stay greyed out until how the score came has been picked. */
.pl.locked{opacity:.35}
.pl.locked:active{transform:none}
.typehint{margin:14px 0 0;font-size:14px;font-weight:600;color:var(--accent)}
.typehint.warn{color:var(--warn)}
.addrow input:disabled{opacity:.4}
.addrow button.locked{opacity:.4}
.addrow{display:flex;gap:8px;margin-top:14px}
.bulk{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.bulk h4{margin:0 0 4px;font-size:16px}
.bulk textarea{width:100%;min-height:150px;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--line);
  background:var(--deep);color:#fff;font:16px/1.45 var(--sans);resize:vertical}
.bulk button{display:block;width:100%;margin-top:8px;padding:14px;border-radius:12px;background:var(--accent);color:#0B2B1A;font-weight:700;font-size:17px}
.pl .x{flex:none;width:34px;height:34px;margin:-6px -6px -6px 4px;border-radius:50%;font-size:18px;color:var(--mute);background:rgba(0,0,0,.18)}
.ok{color:var(--accent);font-weight:600;margin-top:8px}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.extra button{padding:15px 8px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:15px}
.chips button.on{background:#fff;color:var(--deep);border-color:#fff}
.chips button.cy.on{background:#F2C94C;border-color:#F2C94C;color:#2B1D00}
.chips button.cb.on{background:#111;border-color:#fff;color:#fff}
.chips button.cr.on{background:var(--red);border-color:var(--red);color:#fff}
.sheet h4{margin:18px 0 0;font-size:14px;color:var(--mute);font-weight:600}
.picked{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;gap:10px}
.picked button{color:var(--accent);font-weight:600}
.save{display:block;width:100%;margin-top:14px;padding:16px;border-radius:12px;background:var(--accent);color:#0B2B1A;font-weight:700;font-size:18px}
.sr.plain{cursor:default}
.sr .k.cy{color:#F2C94C}.sr .k.cb{color:#fff}.sr .k.cr{color:#FF8A80}
.addrow input{flex:1;min-width:0}
.addrow button{flex:none;padding:0 16px;border-radius:10px;background:var(--accent);color:#0B2B1A;font-weight:700}
@media (prefers-reduced-motion:reduce){.flash,.webstate.on i{animation:none}.hit:active,.pl:active{transform:none}}
</style>
</head>
<body>
<main id="app"></main>
<script src="live-config.js?v=5"></script>
<script>
(function () {
  var C = window.KGAA_LIVE || {};
  var DB = (C.dbUrl || '').replace(/\/$/, ''), KEY = C.apiKey || '';
  var app = document.getElementById('app');
  /* The club's teams. Picking one from this list at setup is what ties a
     match, its players and its results to the same team every time.
     Lowest grades: boys U13, girls U14. */
  var TEAM_LIST = [
    ['men', ['Senior', 'Junior A', 'Junior C', 'U20', 'U17', 'U16', 'U15', 'U14', 'U13']],
    ['ladies', ['Intermediate', 'Junior', 'Minor', 'U16', 'U14']]
  ];
  var TEAMS = {};                                /* id -> {label, branch} */
  TEAM_LIST.forEach(function (g) {
    g[1].forEach(function (n) {
      TEAMS[g[0] + '-' + n.toLowerCase().replace(/[^a-z0-9]+/g, '-')] = { label: (g[0] === 'ladies' ? 'Ladies ' : '') + n, branch: g[0] };
    });
  });
  /* Competitions for each team. Once a team is picked at setup, only its
     competitions come up in the list, but any other name can still be typed.
     To add or rename one, edit the names here. */
  var CHALLENGE = 'Challenge match';
  var COMPS = {
    'men-senior': ['Senior Football Championship', 'ACFL Division 2', 'Kelly Cup'],
    'men-junior-a': ['Junior Football Championship', 'ACFL Division 4', 'Kelly Cup'],
    'men-junior-c': ['Junior C Football Championship', 'ACFL Division 7', 'Kelly Cup'],
    'men-u20': ['U20 Football Championship'],
    'men-u17': ['U17 Football Championship', 'U17 Football League'],
    'men-u16': [],
    'men-u15': ['U15 Football Championship', 'U15 Football League'],
    'men-u14': [],
    'men-u13': ['U13 Football Competition'],
    'ladies-intermediate': ['Ladies Intermediate Championship', 'Ladies Adult Division 2 League'],
    'ladies-junior': ['Ladies Junior B Championship', 'Ladies Adult Division 4 League'],
    'ladies-minor': [],
    'ladies-u16': [],
    'ladies-u14': []
  };
  var ALL_COMPS = [];                            /* every listed name, once */
  Object.keys(COMPS).forEach(function (id) { COMPS[id].forEach(function (n) { if (ALL_COMPS.indexOf(n) < 0) ALL_COMPS.push(n); }); });
  ALL_COMPS.push(CHALLENGE);
  function compsFor(id) { return id ? (COMPS[id] || []).concat([CHALLENGE]) : ALL_COMPS; }
  var AFTER_FT = 5 * 60000;   /* the website drops a match this long after full time */

  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var auth = LS.get('kl_auth', null);          /* {id, refresh, exp} */
  var queue = LS.get('kl_queue', []);          /* writes waiting to reach the server */
  var server = {}, loaded = false, online = true, blocked = '', flushing = false;
  var screen = auth ? 'list' : 'signin', cur = LS.get('kl_cur', null), draft = { venue: 'home' }, wake = null;
  var picking = null;                          /* {ev: eventId, typed} while naming a scorer, {manage: true} for the players list */
  var HOLD_MS = 800, holdT = null, holdBtn = null;   /* press-and-hold on the half / full-time buttons */
  if (cur && screen === 'list') screen = 'match';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function fmt(g, p) { return g + '-' + (p < 10 ? '0' : '') + p; }
  function club() { return 'Killeshin'; }
  /* v is 'g' (goal, 3), '2' (two-pointer, 2 in the points column) or 'p' (point, 1). */
  function tally(m) {
    var r = { kg: 0, kp: 0, og: 0, op: 0 }, ev = m.events || {};
    for (var k in ev) {
      var e = ev[k]; if (!e || (e.s !== 'k' && e.s !== 'o')) continue;
      if (e.v === 'g') r[e.s + 'g']++; else r[e.s + 'p'] += (e.v === '2' ? 2 : 1);
    }
    return r;
  }
  function word(v) { return v === 'g' ? 'goal' : v === '2' ? '2-pointer' : 'point'; }
  function mins(t) { return Math.floor((Date.now() - t) / 60000) + 1 + '\u2032'; }
  /* The running clock: minutes and seconds since the current half started,
     ticking on screen every second. Half-time shows how long the break has
     been; before throw-in it shows the time of day. */
  function mmss(ms) { var t = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(t / 60), s = t % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function bigClock(m) {
    var run = { '1h': m.t1h, '2h': m.t2h, et1: m.tet1, et2: m.tet2 }[m.status];
    if (run) return { t: mmss(Date.now() - run), k: '' };
    var brk = { ht: m.tht, etb: m.tetb, etht: m.tetht }[m.status];
    if (brk) return { t: 'Break ' + mmss(Date.now() - brk), k: 'ht' };
    if (m.status === 'ft') return { t: 'FT', k: 'idle' };
    return { t: hhmm(Date.now()), k: 'idle' };
  }
  function hhmm(t) { var d = new Date(t); return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); }
  function isLive(m) { return m.live !== false; }   /* matches from before Go live existed count as live */
  function clock(m) {
    switch (m.status) {
      case '1h': return { l: '1st half', m: m.t1h ? mins(m.t1h) : '', k: '' };
      case 'ht': return { l: 'Half-time', m: '', k: 'ht' };
      case '2h': return { l: '2nd half', m: m.t2h ? mins(m.t2h) : '', k: '' };
      case 'etb': return { l: 'Extra time next', m: '', k: 'ht' };
      case 'et1': return { l: 'Extra time 1st half', m: m.tet1 ? mins(m.tet1) : '', k: '' };
      case 'etht': return { l: 'Extra time half-time', m: '', k: 'ht' };
      case 'et2': return { l: 'Extra time 2nd half', m: m.tet2 ? mins(m.tet2) : '', k: '' };
      case 'ft': return { l: 'Full time', m: '', k: 'idle' };
      default: return { l: 'Not started', m: '', k: 'idle' };
    }
  }
  var HALF = { '2h': '2nd half', et1: 'extra time 1st half', et2: 'extra time 2nd half' };
  function steps(m) {
    var from = m.ftFrom || '2h';
    return ({
      pre: [['1h', 'Throw in: start 1st half']],
      '1h': [['ht', 'Half-time']],
      ht: [['2h', 'Start 2nd half']],
      '2h': [['ft', 'Full time'], ['etb', 'Extra time: 2 \u00d7 10 minutes']],
      etb: [['et1', 'Start extra time 1st half']],
      et1: [['etht', 'Extra time half-time']],
      etht: [['et2', 'Start extra time 2nd half']],
      et2: [['ft', 'Full time']],
      ft: [[from, 'Reopen ' + (HALF[from] || '2nd half')]]
    })[m.status || 'pre'] || [];
  }

  /* ---------- scorers ----------
     Each Killeshin score can carry a player name (n). Names are remembered
     per team: every name used or added in an earlier match for the same team
     (Senior, U17...) comes back in the picker, so the panel builds itself. */
  function nkey(n) { return String(n || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }
  /* "Senior", "Seniors" and "Senior football" are the same team; so are
     "U14" and "U14s". */
  function teamKey(t) {
    return String(t || '').toLowerCase().replace(/\b(football|team|gaa|lgfa|squad|panel)\b/g, ' ')
      .replace(/[^a-z0-9]+/g, ' ').trim().split(' ').map(function (w) { return w.length > 2 ? w.replace(/s$/, '') : w; }).join(' ');
  }
  /* Each team's panel is also kept in its own record that never gets
     deleted, so removing a match (or a test match) never loses the names.
     It sits with the matches but is never live, so the website ignores it. */
  /* Which team a match belongs to. New matches carry the id picked from the
     list; older ones typed by hand are matched up from their name. */
  function teamIdOf(x) {
    if (!x) return '';
    if (x.teamId) return x.teamId;
    var t = String(x.team || ''), b = x.branch || (/ladies|girls|lgfa/i.test(t) ? 'ladies' : 'men');
    return b + '-' + teamKey(t.replace(/\b(ladies|girls|lgfa)\b/ig, ' ')).replace(/ /g, '-');
  }
  function rosterId(m) { return 'roster-' + teamIdOf(m); }
  function pts(r) { return r.g * 3 + r.p; }
  function byPlayer(m, into) {
    var ev = m.events || {};
    for (var k in ev) {
      var e = ev[k]; if (!e || e.s !== 'k' || !e.n) continue;
      var id = nkey(e.n); if (!id) continue;
      var r = into[id] || (into[id] = { n: e.n, g: 0, p: 0 });
      if (e.v === 'g') r.g++; else r.p += (e.v === '2' ? 2 : 1);
    }
    return into;
  }
  /* Today's scorers first (highest first), then the team's season scorers,
     then the rest of the panel A to Z. */
  function candidates(v, m) {
    var today = byPlayer(m, {}), season = {}, names = {}, tk = teamIdOf(m), k;
    var added = {}, hidden = {};                 /* latest add / remove time per player, across the team's matches */
    var pool = {};                               /* live matches plus finished ones moved to the stats store */
    for (k in archived) pool[k] = archived[k];
    for (k in v) pool[k] = v[k];
    Object.keys(pool).forEach(function (id) {
      var x = pool[id]; if (!x || teamIdOf(x) !== tk) return;
      var a = x.squadAt || {}, h = x.hide || {}, q;
      for (q in a) added[q] = Math.max(added[q] || 0, a[q]);
      for (q in h) hidden[q] = Math.max(hidden[q] || 0, h[q]);
      if (id === cur) return;
      byPlayer(x, season);
      var sq = x.squad || {}; for (q in sq) if (!names[q]) names[q] = sq[q];
    });
    var own = m.squad || {}; for (k in own) names[k] = own[k];
    for (k in season) if (!names[k]) names[k] = season[k].n;
    for (k in today) names[k] = today[k].n;
    for (k in hidden) if (!today[k] && hidden[k] > (added[k] || 0)) delete names[k];
    return Object.keys(names).map(function (k) {
      return { k: k, n: names[k], t: today[k] || { g: 0, p: 0 }, s: season[k] || { g: 0, p: 0 } };
    }).sort(function (a, b) { return pts(b.t) - pts(a.t) || pts(b.s) - pts(a.s) || a.n.localeCompare(b.n); });
  }
  /* How a score came: saved on the score as t. From play is saved as no t. */
  var TYPES = {
    g: [['play', 'From play'], ['pen', 'Penalty'], ['free', 'Free']],
    '2': [['play', 'From play'], ['free', 'Free'], ['45', '45'], ['side', 'Sideline']],
    p: [['play', 'From play'], ['free', 'Free'], ['mark', 'Mark'], ['45', '45'], ['side', 'Sideline']]
  };
  var TNAME = { free: 'free', pen: 'penalty', '45': '45', mark: 'mark', side: 'sideline' };
  var CARD = { y: 'Yellow card', b: 'Black card', r: 'Red card' };
  function alpha(v, m) { return candidates(v, m).slice().sort(function (a, b) { return a.n.localeCompare(b.n); }); }
  function when(m, ts) {
    var L = [['tet2', 'ET 2nd half'], ['tet1', 'ET 1st half'], ['t2h', '2nd half'], ['t1h', '1st half']];
    for (var i = 0; i < L.length; i++) { var t = m[L[i][0]]; if (t && ts >= t) return L[i][1] + ' ' + (Math.floor((ts - t) / 60000) + 1) + '\u2032'; }
    return hhmm(ts);
  }

  /* Turn a pasted team sheet into names: one per line (or comma separated),
     jersey numbers, "(c)" and headings like SUBS stripped, CAPITALS tidied. */
  function parseNames(txt) {
    var parts = String(txt || '').split(/\n|;/);
    if (parts.length < 2) parts = String(txt || '').split(',');
    var seen = {}, out = [];
    parts.forEach(function (l) {
      var n = l.replace(/\(.*?\)/g, ' ').replace(/^[\s\d.\-\u2013:)#]+/, '').replace(/[\s\d.\-\u2013]+$/, '')
        .replace(/\s+/g, ' ').trim();
      if (!/[a-z]/i.test(n) || n.length < 3) return;
      if (n.split(' ').length <= 2 && /^(subs|substitutes|panel|team|teamsheet|management|manager|mentors?|selectors?|starting|squad|captain|backs|forwards|midfield)\b/i.test(n)) return;
      if (/\b(killeshin|gleann|uise[a\u00e1]n|gaa|clg|lgfa|club|v|vs)\b/i.test(n)) return;   /* titles like "Killeshin Seniors v Portlaoise" */
      if (n === n.toUpperCase()) n = n.toLowerCase().replace(/(^|[\s'\-])([a-z])/g, function (a, b, c) { return b + c.toUpperCase(); });
      var k = nkey(n); if (!k || seen[k]) return;
      seen[k] = 1; out.push(n);
    });
    return out;
  }
  /* Add names to this match's panel in one write, so a whole team goes up in
     a single tap even on poor signal. */
  function addToSquad(base, list) {
    var v = view(), m = v[cur]; if (!m || !list.length) return;
    var sq = JSON.parse(JSON.stringify(m.squad || {})), at = JSON.parse(JSON.stringify(m.squadAt || {})), now = Date.now();
    list.forEach(function (n) { var k = nkey(n); if (k) { sq[k] = n; at[k] = now; } });
    queue.push({ m: 'PATCH', p: base, b: { squad: sq, squadAt: at } });
    var rid = rosterId(m), r = v[rid] || {};
    var rsq = JSON.parse(JSON.stringify(r.squad || {})), rat = JSON.parse(JSON.stringify(r.squadAt || {}));
    list.forEach(function (n) { var k = nkey(n); if (k) { rsq[k] = n; rat[k] = now; } });
    queue.push({ m: 'PATCH', p: '/live/matches/' + rid, b: { team: m.team, teamId: teamIdOf(m), branch: m.branch || 'men', roster: true, live: false, created: 0, squad: rsq, squadAt: rat } });
  }
  /* Copy names already sitting in older matches into the team's permanent
     record, the first time a match for that team is opened. */
  function saveRoster(v, m) {
    if (!loaded || v[rosterId(m)]) return;
    var names = candidates(v, m).map(function (p) { return p.n; });
    if (names.length) { addToSquad('/live/matches/' + cur, names); LS.set('kl_queue', queue); flush(); }
  }

  /* ---------- sign-in (Firebase email/password over REST) ---------- */
  function saveAuth(id, refresh, secs) { auth = { id: id, refresh: refresh, exp: Date.now() + (+secs) * 1000 }; LS.set('kl_auth', auth); }
  function signIn(email, pw) {
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: pw, returnSecureToken: true })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j.error && j.error.message) || 'failed');
        saveAuth(j.idToken, j.refreshToken, j.expiresIn);
      });
    });
  }
  function token(force) {
    if (!auth) return Promise.reject(new Error('signed-out'));
    if (!force && auth.exp - Date.now() > 60000) return Promise.resolve(auth.id);
    return fetch('https://securetoken.googleapis.com/v1/token?key=' + KEY, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(auth.refresh)
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) { if (r.status === 400) { auth = null; LS.del('kl_auth'); blocked = 'Signed out. Sign in again to save scores.'; } throw new Error('refresh'); }
        saveAuth(j.id_token, j.refresh_token, j.expires_in);
        return auth.id;
      });
    });
  }

  /* ---------- write queue: every tap is saved on the phone first, then sent ---------- */
  function enqueue(op) { queue.push(op); LS.set('kl_queue', queue); render(); flush(); }
  function send(op, tok) {
    return fetch(DB + op.p + '.json?auth=' + encodeURIComponent(tok), {
      method: op.m, headers: { 'Content-Type': 'application/json' },
      body: op.m === 'DELETE' ? undefined : JSON.stringify(op.b)
    });
  }
  function flush() {
    if (flushing || !queue.length || blocked) return;
    flushing = true;
    var op = queue[0];
    token().then(function (tok) { return send(op, tok); })
      .then(function (r) {
        if (r.status !== 401) return r;
        return token(true).then(function (tok) { return send(op, tok); });
      })
      .then(function (r) {
        online = true;
        if (r.status === 401 || r.status === 403) { blocked = 'This login can\u2019t save scores. Check the scorer UID in the database rules.'; return; }
        if (!r.ok && r.status !== 400) throw new Error('http ' + r.status);
        if (r.ok) applyOp(server, op); queue.shift(); LS.set('kl_queue', queue);          /* 400 = bad write: drop it so the queue can't jam */
      })
      .catch(function () { online = false; setTimeout(flush, 5000); })
      .then(function () { flushing = false; render(); if (online && queue.length && !blocked) flush(); });
  }

  /* ---------- reading: server copy + anything still waiting to send ---------- */
  function pull() {
    return fetch(DB + '/live/matches.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { server = j || {}; loaded = true; online = true; if (!picking) render(); /* don't jump the player list while it's open */ checkArchive(); })
      .catch(function () { online = false; render(); });
  }

  /* ---------- finished matches move to the stats store ----------
     Once the county board result for a match shows on the website, the
     match is copied to live/stats with a link to that result, so the
     website can put a Match stats button on the result card. It then comes
     off the scorer's list. A match that never gets a county board result
     (a challenge match) moves across after 3 days with no link. */
  var archived = {}, statsLoaded = false, lastCheck = 0, archiving = {};
  var CHECK_EVERY = 5 * 60000, NO_RESULT_AFTER = 3 * 86400000;
  function pullStats() {
    return fetch(DB + '/live/stats.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { archived = j || {}; statsLoaded = true; checkArchive(); })
      .catch(function () { /* try again on the next round */ });
  }
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function dayOf(t) { var d = new Date(t); return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
  function loose(n) { return String(n || '').toLowerCase().replace(/\b(gaa|clg|club|lgfa|ladies)\b/g, ' ').replace(/[^a-z0-9]/g, ''); }
  function gradeOf(m) { var t = TEAMS[teamIdOf(m)]; return String(t ? t.label : (m.team || '')).replace(/^Ladies /, ''); }
  /* Same day, same branch, same grade, and the opposition names agree.
     If the names don't agree but there was only one game for that team
     that day, that's the one. */
  function findResult(m, results) {
    var day = dayOf(m.t1h || m.created), b = m.branch || 'men', g = gradeOf(m), o = loose(m.opp);
    var same = results.filter(function (r) {
      return r && r.date === day && r.branch === b &&
        (r.grade === g || (r.grade === 'Kelly Cup' && /kelly/i.test(m.comp || '')));
    });
    var hit = same.filter(function (r) { var ro = loose(r.opponent); return ro && o && (ro.indexOf(o) > -1 || o.indexOf(ro) > -1); });
    if (hit.length) return hit[0];
    return same.length === 1 ? same[0] : null;
  }
  function checkArchive() {
    if (!auth || !loaded || !statsLoaded || blocked || queue.length) return;
    if (Date.now() - lastCheck < CHECK_EVERY) return;
    var ready = Object.keys(server).filter(function (id) {
      var m = server[id];
      return m && !m.roster && m.status === 'ft' && m.tft && Date.now() - m.tft > AFTER_FT && id !== cur && !archiving[id];
    });
    if (!ready.length) return;
    lastCheck = Date.now();
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) {
        var results = (j && j.results) || [], moved = 0;
        ready.forEach(function (id) {
          var m = server[id]; if (!m || archiving[id] || id === cur) return;
          var r = findResult(m, results);
          if (!r && Date.now() - m.tft < NO_RESULT_AFTER) return;    /* wait for the county board */
          var rec = JSON.parse(JSON.stringify(m));
          rec.archived = Date.now();
          if (r) rec.link = { date: r.date, branch: r.branch, grade: r.grade, opp: r.opponent };
          archiving[id] = 1; archived[id] = rec; moved++;
          queue.push({ m: 'PUT', p: '/live/stats/' + id, b: rec });          /* copy first... */
          queue.push({ m: 'DELETE', p: '/live/matches/' + id });            /* ...then remove, in that order */
        });
        if (moved) { LS.set('kl_queue', queue); render(); flush(); }
      })
      .catch(function () { lastCheck = Date.now() - CHECK_EVERY + 60000; /* website not reachable: try again in a minute */ });
  }
  function applyOp(v, op) {
    if (!/^\/live\/matches(\/|$)/.test(op.p)) return;   /* writes to the stats store don't touch the match list */
    var parts = op.p.replace(/^\/live\/matches\/?/, '').split('/').filter(Boolean);
    if (!parts.length) return;
    var o = v;
    for (var i = 0; i < parts.length - 1; i++) {
      if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') { if (op.m === 'DELETE') return; o[parts[i]] = {}; }
      o = o[parts[i]];
    }
    var k = parts[parts.length - 1];
    if (op.m === 'PUT') o[k] = JSON.parse(JSON.stringify(op.b));
    else if (op.m === 'DELETE') delete o[k];
    else if (op.m === 'PATCH') { o[k] = o[k] || {}; for (var f in op.b) { if (op.b[f] === null) delete o[k][f]; else o[k][f] = op.b[f]; } }
  }
  function view() { var v = JSON.parse(JSON.stringify(server)); queue.forEach(function (op) { applyOp(v, op); }); return v; }

  /* ---------- screens ---------- */
  function syncLine() {
    if (blocked) return '<span class="sync bad">' + esc(blocked) + '</span>';
    if (queue.length) return '<span class="sync wait">' + queue.length + (queue.length === 1 ? ' tap' : ' taps') + ' waiting for signal</span>';
    return '<span class="sync">' + (online ? 'All saved' : 'No signal') + '</span>';
  }
  function drawSignin(err) {
    if (!DB || DB.indexOf('YOUR-') > -1 || !KEY || KEY.indexOf('YOUR-') > -1) {

      '<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">' +
      '<button class="primary" data-act="signin">Sign in</button>' + (err ? '<p class="err">' + esc(err) + '</p>' : '');
  }
  function drawList() {
    var v = view(), ids = Object.keys(v).sort(function (a, b) { return (v[b].created || 0) - (v[a].created || 0); });

    else if (!recent.length) h += '<p class="empty">No matches today. Set one up before throw-in.</p>';
    recent.forEach(function (id) {
      var m = v[id], t = tally(m), c = clock(m);
      h += '<button class="row" data-act="open" data-id="' + esc(id) + '"><span><div class="t">' + esc(m.team) + ' v ' + esc(m.opp) + '</div>' +
        '<div class="c">' + c.l + (c.m ? ' ' + c.m : '') + (m.delayed ? ' \u00b7 <span class="tag">Delayed</span>' : '') + (isLive(m) ? '' : ' \u00b7 <span class="tag">Not on website</span>') + '</div></span>' +
        '<span class="s">' + fmt(t.kg, t.kp) + ' : ' + fmt(t.og, t.op) + '</span></button>';
    });
    h += '<button class="quiet" data-act="signout">Sign out</button>';
    app.innerHTML = h;
  }
  /* The team's competitions as buttons under the box: tap one to fill it in. */
  function compChips(id, chosen) {

  function drawNew(err) {
    var vv = view(), counts = {};                   /* how many players each team has saved */
    Object.keys(vv).forEach(function (id) { var x = vv[id]; if (x && x.roster) counts[teamIdOf(x)] = Object.keys(x.squad || {}).length; });
    var opts = '<option value="">Choose a team\u2026</option>' + TEAM_LIST.map(function (g) {

  function lastEvent(m) {

  /* The pop-up list of players: after a Killeshin score, or from Players. */

  function typeChips(e, m, chosen) {

  function drawCard(v, m) {

    }).join('') + '</div>';

        '<div class="addrow"><input id="nn" placeholder="e.g. No. 7" autocomplete="off" enterkeyhint="done"><button data-act="cardopp">Save</button></div>';
    }
    return h + '<button class="undo" data-act="pickclose">Cancel</button></div></div>';
  }
  function drawPicker(v, m) {
    if (picking.sub) return drawSub(v, m);
    if (picking.card) return drawCard(v, m);
    var e = picking.ev ? (m.events || {})[picking.ev] : null;
    if (picking.ev && !e) { picking = null; return ''; }
    if (e && e.s === 'o') {                       /* opposition score: just how it came */
      return '<div class="sheetbg" data-act="pickclose"><div class="sheet" data-act="none"><h3>' + esc(m.opp || 'Opposition') + ' ' + word(e.v) + '</h3>' +
        '<p class="note">How did it come?</p>' + typeChips(e, m) + '<button class="undo" data-act="pickclose">Done</button></div></div>';
    }
    /* A new Killeshin score: how it came must be picked before the player. */
    var locked = !!(picking.ev && !picking.typed);
    var list = candidates(v, m), cur_ = e && e.n ? nkey(e.n) : '';
    var h = '<div class="sheetbg" data-act="pickclose"><div class="sheet" data-act="none">';
    h += picking.ev
      ? '<h3>' + (e.v === 'g' ? 'Goal' : e.v === '2' ? '2-pointer' : 'Point') + '</h3>' +
        '<h4>How did it come?</h4>' + typeChips(e, m, picking.typed ? true : false) +
        (locked ? '<p class="typehint' + (picking.nudge ? ' warn' : '') + '">' +
          (picking.nudge ? 'Pick how it came above first, then the player.' : 'Pick how it came first, then the player.') + '</p>' : '') +
        '<h4>Who scored it? <span style="opacity:.75">Top scorers first</span></h4>'
      : '<h3>' + esc(m.team) + ' players</h3><p class="note">Names added here come up when you record a score, in this match and every later ' + esc(m.team) + ' match.</p>';
    list.forEach(function (p) {
      var hot = pts(p.t) > 0;

  function drawMatch() {

    }).join('') + '<p class="note" id="holdhint" style="text-align:center;margin-top:6px">Hold the button for a second to change the half. A quick tap does nothing.</p>';

    /* Scorers so far, top scorer first, plus any scores still to be named. */
    var sc = byPlayer(m, {}), scl = Object.keys(sc).map(function (k) { return sc[k]; })

    var ours = Object.keys(m.events || {}).filter(function (k) { var x = m.events[k]; return x && x.s === 'k'; })
      .sort(function (a, b) { return m.events[b].ts - m.events[a].ts; });
    var unnamed = ours.filter(function (k) { return !m.events[k].n; }).length;
    var scorers = (scl.length || unnamed)

        (unnamed ? (scl.length ? ' \u00b7 ' : '') + '<span class="tag">' + unnamed + ' not named</span>' : '') + '</div>'
      : '';
    saveRoster(v, m);
    var squadN = candidates(v, m).length;

    var items = [], evs = m.events || {}, logs = m.log || {}, q;
    for (q in evs) if (evs[q]) items.push({ id: q, ts: evs[q].ts, e: evs[q] });

              if (x.s === 'o') return '<button class="sr" data-act="rename" data-id="' + esc(it.id) + '"><span class="k" style="color:var(--mute)">' + esc(lbl) + small + '</span><span class="who" style="color:var(--mute)">' + esc(them) + '</span></button>';
              return '<button class="sr" data-act="rename" data-id="' + esc(it.id) + '"><span class="k">' + esc(lbl) + small + '</span><span class="who">' + (x.n ? esc(x.n) : '<span class="tag">Add scorer</span>') + '</span></button>';

    app.innerHTML = '<div class="top"><button class="link" data-act="back">\u2039 Matches</button>' + syncLine() + '</div>' +
      '<div class="meta">' + esc(m.team) + ', ' + (m.venue === 'away' ? 'away' : m.venue === 'neutral' ? 'neutral venue' : 'home') + (m.comp ? ' \u00b7 ' + esc(m.comp) : '') + '</div>' +

      (function () { var bc = bigClock(m); return '<div class="clock"><b class="' + c.k + '">' + c.l + '</b><span class="big ' + bc.k + '" id="clk">' + esc(bc.t) + '</span></div>'; })() +
      scorers +
      '<div class="pad"><h2>' + esc(us) + '</h2>' +
      '<button class="hit us" data-act="score" data-s="k" data-v="g"' + off + '>GOAL<span>+3</span></button>' +
      '<button class="hit us" data-act="score" data-s="k" data-v="2"' + off + '>2 POINTS<span>+2</span></button>' +

      '<button class="hit them" data-act="score" data-s="o" data-v="2"' + off + '>2 POINTS<span>+2</span></button>' +
      '<button class="hit them" data-act="score" data-s="o" data-v="p"' + off + '>POINT<span>+1</span></button></div>' +

      stageBtns +

  function render() {
    if (holdT) return;                            /* a stage button is being held: don't redraw under the finger */

  }
  function go(s) { picking = null; screen = s; if (s === 'match') { LS.set('kl_cur', cur); keepAwake(); } else if (s === 'list') { LS.del('kl_cur'); cur = null; } render(); }

  function keepAwake() {
    try { if ('wakeLock' in navigator && !wake) navigator.wakeLock.request('screen').then(function (w) { wake = w; w.addEventListener('release', function () { wake = null; }); }).catch(function () {}); } catch (e) {}
  }
  function keepDraft() {
    var tm = document.getElementById('tm'), op = document.getElementById('op'), cp = document.getElementById('cp');

  function blur() { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }

  /* Subs and cards go in the match log with the time they happened. */
  function logItem(base, rec) {

    var m = view()[cur]; if (!m) return;

      var k = nkey(name);

  /* ---------- taps ---------- */

      LS.set('kl_email', em);

        .catch(function (e) { drawSignin(/CREDENTIAL|PASSWORD|EMAIL/.test(e.message) ? 'Email or password not recognised.' : 'Couldn\u2019t reach the server. Check signal and try again.'); });

      cur = uid('m');

      if (comp) rec.comp = comp;

  /* Keep what's typed on the setup screen, so a refresh never wipes it.

    }
  });

  document.addEventListener('visibilitychange', function () { if (!document.hidden) { pull(); flush(); if (screen === 'match') keepAwake(); } });
  window.addEventListener('online', flush);
  setInterval(function () { if (!document.hidden) pull(); }, 8000);
  setInterval(function () {
    var el = document.getElementById('clk'); if (!el || screen !== 'match') return;
    var m = view()[cur]; if (!m) return;
    var bc = bigClock(m); el.textContent = bc.t; el.className = 'big ' + bc.k;
  }, 1000);
  setInterval(function () { if (!document.hidden) pullStats(); }, 10 * 60000);
  render(); pull(); pullStats(); flush();
})();
</script>
</body>
</html>
